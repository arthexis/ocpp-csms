name: Trusted appliance CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read

jobs:
  appliance:
    name: Gway-001 simulator execution
    # Never schedule untrusted fork PRs on a persistent field machine.
    if: >-
      contains(github.event.pull_request.labels.*.name, 'simulator') &&
      github.event.pull_request.user.login == 'arthexis' &&
      github.event.pull_request.head.repo.full_name == 'arthexis/ocpp-csms' &&
      github.event.pull_request.head.repo.owner.login == 'arthexis' &&
      github.event.pull_request.draft == false
    runs-on: [self-hosted, Linux, ARM64, gway-001]
    timeout-minutes: 25
    concurrency:
      group: appliance-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Signal appliance job start
        if: ${{ always() }}
        continue-on-error: true
        env:
          CODEX_SOUND_HOOK_LOCK_WAIT: "0"
          CODEX_SOUND_HOOK_TIMEOUT: "2"
        run: /home/arthe/.local/bin/codex-sound-hook actions-job-start busy

      - name: Check out trusted PR head
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Create isolated Python environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install ".[dev]" ansible-core ansible-lint

      - name: Run CSMS and Forwarder tests
        run: .venv/bin/python -m pytest -n 2 tests --ignore=tests/ocpp_discover --ignore=tests/ansible

      - name: Run Discover tests
        run: .venv/bin/python -m pytest tests/ocpp_discover

      - name: Run Ansible contract tests
        run: PYTHONPATH=src .venv/bin/python -m pytest tests/ansible

      - name: Real CSMS and simulator charging smoke test
        timeout-minutes: 2
        run: timeout --signal=TERM --kill-after=5s 100s .venv/bin/python scripts/pr_simulator_smoke.py

      - name: Signal appliance job result
        if: ${{ always() }}
        continue-on-error: true
        env:
          CODEX_SOUND_HOOK_LOCK_WAIT: "0"
          CODEX_SOUND_HOOK_TIMEOUT: "2"
        run: |
          case "${{ job.status }}" in
            success) sound=ok ;;
            failure) sound=error ;;
            cancelled) sound=warning ;;
            *) sound=notice ;;
          esac
          /home/arthe/.local/bin/codex-sound-hook actions-job-finish "$sound"

  simulator-gate:
    name: Gway-001 appliance tests
    needs: appliance
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate opt-in simulator result
        env:
          SIMULATOR_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'simulator') }}
          TRUSTED_AUTHOR: ${{ github.event.pull_request.user.login == 'arthexis' }}
          TRUSTED_REPO: ${{ github.event.pull_request.head.repo.full_name == 'arthexis/ocpp-csms' }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          APPLIANCE_RESULT: ${{ needs.appliance.result }}
        run: |
          if [ "$SIMULATOR_LABEL" != "true" ]; then
            echo "Simulator label absent: appliance runner not required."
            exit 0
          fi
          if [ "$TRUSTED_AUTHOR" != "true" ] || [ "$TRUSTED_REPO" != "true" ] || [ "$IS_DRAFT" = "true" ]; then
            echo "::error::Simulator checks require a trusted, non-draft, same-repository PR."
            exit 1
          fi
          if [ "$APPLIANCE_RESULT" != "success" ]; then
            echo "::error::Simulator label requires successful appliance execution; got: $APPLIANCE_RESULT"
            exit 1
          fi
          echo "Simulator tests passed."
