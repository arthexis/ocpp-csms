name: Trusted appliance CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  appliance:
    name: Gway-001 appliance tests
    # Never schedule untrusted fork PRs on a persistent field machine.
    if: >-
      github.event.pull_request.user.login == 'arthexis' &&
      github.event.pull_request.head.repo.full_name == 'arthexis/ocpp-csms' &&
      github.event.pull_request.head.repo.owner.login == 'arthexis' &&
      github.event.pull_request.draft == false
    runs-on: [self-hosted, Linux, ARM64, gway-001]
    timeout-minutes: 25
    concurrency:
      group: appliance-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Signal appliance job start
        if: ${{ always() }}
        continue-on-error: true
        env:
          CODEX_SOUND_HOOK_LOCK_WAIT: "0"
          CODEX_SOUND_HOOK_TIMEOUT: "2"
        run: /home/arthe/.local/bin/codex-sound-hook actions-job-start busy

      - name: Check out trusted PR head
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Create isolated Python environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install ".[dev]" ansible-core ansible-lint

      - name: Run CSMS and Forwarder tests
        run: .venv/bin/python -m pytest -n 2 tests --ignore=tests/ocpp_discover --ignore=tests/ansible

      - name: Run Discover tests
        run: .venv/bin/python -m pytest tests/ocpp_discover

      - name: Run Ansible contract tests
        run: PYTHONPATH=src .venv/bin/python -m pytest tests/ansible

      - name: Signal appliance job result
        if: ${{ always() }}
        continue-on-error: true
        env:
          CODEX_SOUND_HOOK_LOCK_WAIT: "0"
          CODEX_SOUND_HOOK_TIMEOUT: "2"
        run: |
          case "${{ job.status }}" in
            success) sound=ok ;;
            failure) sound=error ;;
            cancelled) sound=warning ;;
            *) sound=notice ;;
          esac
          /home/arthe/.local/bin/codex-sound-hook actions-job-finish "$sound"
