name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  push:
    branches:
      - main

jobs:
  changes:
    name: Validate change scope
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate documentation-only changes
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          docs_only=true
          if (( ${#changed[@]} == 0 )); then
            docs_only=false
          fi

          for path in "${changed[@]}"; do
            case "$path" in
              README.md|docs/*|*.md)
                ;;
              *)
                docs_only=false
                break
                ;;
            esac
          done

          printf 'Changed files:\n'
          printf '  %s\n' "${changed[@]}"
          echo "docs_only=$docs_only" | tee -a "$GITHUB_OUTPUT"

  docs:
    name: Documentation only
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Documentation-only change validated
        run: echo "Only documentation files changed; full CI is not required."

  test:
    name: ${{ matrix.platform }} / ${{ matrix.suite }}
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        platform:
          - Debian 12 / Python 3.11
          - Debian 13 / Python 3.13
        suite:
          - CSMS tests
          - Discover tests
        include:
          - platform: Debian 12 / Python 3.11
            image: python:3.11-bookworm
          - platform: Debian 13 / Python 3.13
            image: python:3.13-trixie
    container:
      image: ${{ matrix.image }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Installed command smoke
        if: matrix.suite == 'CSMS tests'
        run: |
          ocpp-csms --help >/dev/null
          ocpp-discover --help >/dev/null
          ocpp-forwarder --help >/dev/null

      - name: CSMS tests
        if: matrix.suite == 'CSMS tests'
        run: timeout --signal=TERM --kill-after=10s 300s python -m pytest -n 2 -vv tests --ignore=tests/ocpp_discover --ignore=tests/ansible

      - name: Discover tests
        if: matrix.suite == 'Discover tests'
        run: timeout --signal=TERM --kill-after=10s 300s python -m pytest -vv tests/ocpp_discover


  ansible:
    name: Ansible tests
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Appliance script syntax
        run: sh -n deploy.sh

      - name: Install Ansible validation tools
        run: python -m pip install pytest "pytest-timeout>=2.3,<3" ansible-core ansible-lint

      - name: Ansible syntax check
        run: ansible-playbook ansible/playbooks/satellite.yml -i localhost, --syntax-check

      - name: Ansible lint
        run: ansible-lint --profile basic ansible/

      - name: Ansible contract tests
        run: PYTHONPATH=src timeout --signal=TERM --kill-after=10s 300s python -m pytest -vv tests/ansible


  simulator:
    name: Simulator appliance integration
    # Never execute untrusted code from forks on the persistent field runner.
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'simulator') &&
      github.event.pull_request.user.login == 'arthexis' &&
      github.event.pull_request.head.repo.full_name == 'arthexis/ocpp-csms' &&
      github.event.pull_request.head.repo.owner.login == 'arthexis' &&
      github.event.pull_request.draft == false
    runs-on: [self-hosted, Linux, ARM64, gway-001]
    timeout-minutes: 25
    concurrency:
      group: simulator-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Signal appliance job start and show PR on LCD
        if: ${{ always() }}
        continue-on-error: true
        env:
          CODEX_SOUND_HOOK_LOCK_WAIT: "0"
          CODEX_SOUND_HOOK_TIMEOUT: "2"
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          /home/arthe/.local/bin/codex-sound-hook actions-job-start busy
          if [[ -x /home/arthe/.local/bin/lcd-actions-runner-status ]]; then
            /home/arthe/.local/bin/lcd-actions-runner-status start "$PR_NUMBER" "$PR_BRANCH"
          fi

      - name: Check out trusted PR head
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Create isolated Python environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install ".[dev]"

      - name: Real CSMS and simulator charging smoke test
        timeout-minutes: 2
        run: timeout --signal=TERM --kill-after=5s 100s .venv/bin/python scripts/pr_simulator_smoke.py

      - name: Clear runner LCD and signal job result
        if: ${{ always() }}
        continue-on-error: true
        env:
          CODEX_SOUND_HOOK_LOCK_WAIT: "0"
          CODEX_SOUND_HOOK_TIMEOUT: "2"
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [[ -x /home/arthe/.local/bin/lcd-actions-runner-status ]]; then
            /home/arthe/.local/bin/lcd-actions-runner-status stop
          fi
          case "$JOB_STATUS" in
            success) sound=ok ;;
            failure) sound=error ;;
            cancelled) sound=warning ;;
            *) sound=notice ;;
          esac
          /home/arthe/.local/bin/codex-sound-hook actions-job-finish "$sound"

  ci:
    name: CI
    needs:
      - changes
      - docs
      - test
      - ansible
      - simulator
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Require successful CI
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          DOCS_RESULT: ${{ needs.docs.result }}
          TEST_RESULT: ${{ needs.test.result }}
          ANSIBLE_RESULT: ${{ needs.ansible.result }}
          SIMULATOR_RESULT: ${{ needs.simulator.result }}
          SIMULATOR_LABEL: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'simulator') }}
          TRUSTED_SIMULATOR_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'arthexis' && github.event.pull_request.head.repo.full_name == 'arthexis/ocpp-csms' && github.event.pull_request.head.repo.owner.login == 'arthexis' && github.event.pull_request.draft == false }}
        run: |
          set -euo pipefail

          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change-scope validation did not succeed: $CHANGES_RESULT"
            exit 1
          fi

          if [[ "$SIMULATOR_LABEL" == "true" ]]; then
            if [[ "$TRUSTED_SIMULATOR_PR" != "true" || "$SIMULATOR_RESULT" != "success" ]]; then
              echo "Simulator label requires a successful trusted appliance test: $SIMULATOR_RESULT"
              exit 1
            fi
          else
            echo "Simulator label absent: no self-hosted runner required."
          fi

          if [[ "$DOCS_ONLY" == "true" ]]; then
            if [[ "$DOCS_RESULT" != "success" ]]; then
              echo "Documentation validation did not succeed: $DOCS_RESULT"
              exit 1
            fi
            exit 0
          fi

          if [[ "$TEST_RESULT" != "success" ]]; then
            echo "Test matrix did not succeed: $TEST_RESULT"
            exit 1
          fi

          if [[ "$ANSIBLE_RESULT" != "success" ]]; then
            echo "Ansible validation did not succeed: $ANSIBLE_RESULT"
            exit 1
          fi
