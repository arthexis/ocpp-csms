name: CI
# Cache experiment: warm-run validation.

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        include:
          - name: Debian 12 / Python 3.11
            image: python:3.11-bookworm
            cache-key: py311-bookworm
          - name: Debian 13 / Python 3.13
            image: python:3.13-trixie
            cache-key: py313-trixie
    container:
      image: ${{ matrix.image }}
    env:
      PIP_CACHE_DIR: /tmp/pip-cache

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore pip cache
        uses: actions/cache@v4
        with:
          path: /tmp/pip-cache
          key: pip-${{ matrix.cache-key }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ matrix.cache-key }}-

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: CSMS tests
        run: python -m pytest

      - name: Field harness tests
        run: python -m pytest field/tests
