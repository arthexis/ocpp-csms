name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

jobs:
  changes:
    name: Validate change scope
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify deploy.sh is executable in Git and checkout
        shell: bash
        run: |
          set -euo pipefail
          mode="$(git ls-files --stage -- deploy.sh | awk '{print $1}')"
          if [[ "$mode" != "100755" ]]; then
            echo "::error::deploy.sh must be tracked with Git mode 100755 (found: ${mode:-missing})"
            exit 1
          fi
          test -x deploy.sh || { echo "::error::deploy.sh is not executable in checkout"; exit 1; }

      - name: Validate documentation-only changes
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          docs_only=true
          if (( ${#changed[@]} == 0 )); then
            docs_only=false
          fi

          for path in "${changed[@]}"; do
            case "$path" in
              README.md|docs/*|*.md)
                ;;
              *)
                docs_only=false
                break
                ;;
            esac
          done

          printf 'Changed files:\n'
          printf '  %s\n' "${changed[@]}"
          echo "docs_only=$docs_only" | tee -a "$GITHUB_OUTPUT"

  docs:
    name: Documentation only
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Documentation-only change validated
        run: echo "Only documentation files changed; full CI is not required."

  test:
    name: ${{ matrix.platform }} / ${{ matrix.suite }}
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        platform:
          - Debian 12 / Python 3.11
          - Debian 13 / Python 3.13
        suite:
          - CSMS tests
          - Discover tests
        include:
          - platform: Debian 12 / Python 3.11
            image: python:3.11-bookworm
          - platform: Debian 13 / Python 3.13
            image: python:3.13-trixie
    container:
      image: ${{ matrix.image }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Installed command smoke
        if: matrix.suite == 'CSMS tests'
        run: |
          ocpp-csms --help >/dev/null
          ocpp-discover --help >/dev/null

      - name: CSMS tests
        if: matrix.suite == 'CSMS tests'
        run: timeout --signal=TERM --kill-after=10s 300s python -m pytest -n 2 -vv tests --ignore=tests/ocpp_discover --ignore=tests/ansible

      - name: Discover tests
        if: matrix.suite == 'Discover tests'
        run: timeout --signal=TERM --kill-after=10s 300s python -m pytest -vv tests/ocpp_discover


  
  ubuntu:
    name: Ubuntu 24.04 / Python 3.13 / ${{ matrix.suite }}
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        suite: [CSMS tests, Discover tests]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Installed command smoke
        if: matrix.suite == 'CSMS tests'
        run: |
          ocpp-csms --help >/dev/null
          ocpp-discover --help >/dev/null

      - name: CSMS tests
        if: matrix.suite == 'CSMS tests'
        run: timeout --signal=TERM --kill-after=10s 300s python -m pytest -n 2 -vv tests --ignore=tests/ocpp_discover --ignore=tests/ansible

      - name: Discover tests
        if: matrix.suite == 'Discover tests'
        run: timeout --signal=TERM --kill-after=10s 300s python -m pytest -vv tests/ocpp_discover


  ansible:
    name: Ansible validation
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Appliance script syntax
        run: sh -n deploy.sh

      - name: Install Ansible validation tools
        run: python -m pip install ansible-core ansible-lint

      - name: Ansible syntax check
        run: |
          ansible-playbook ansible/playbooks/install.yml -i localhost, --syntax-check
          ansible-playbook ansible/playbooks/expose.yml -i localhost, --syntax-check
          ansible-playbook ansible/playbooks/uninstall.yml -i localhost, --syntax-check

      - name: Ansible lint
        run: ansible-lint --profile basic ansible/



  ansible_integration:
    name: Ansible integration
    timeout-minutes: 25
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Ansible
        run: python3 -m pip install --user ansible-core

      - name: Run schema-aware deployment integration
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash tests/deployment/integration.sh

      - name: Show service logs on failure
        if: failure()
        run: sudo journalctl -u ocpp-csms.service --no-pager -n 100 || true


  ansible_schema_advance:
    name: Ansible schema advancement
    timeout-minutes: 25
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Ansible
        run: python3 -m pip install --user ansible-core

      - name: Exercise schema advancement with disposable candidate
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # The actual production schema is never changed. Create a disposable
          # candidate commit with only the schema constant incremented, so the
          # integration exercises a genuine base -> newer-schema deployment.
          git worktree add --detach /tmp/ocpp-csms-schema-advance HEAD
          python3 - /tmp/ocpp-csms-schema-advance/src/ocpp_csms/schema.py <<'PY'
          import ast
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          source = path.read_text()
          assignments = [
              node for node in ast.parse(source).body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == "CURRENT_SCHEMA_VERSION" for target in node.targets)
          ]
          assert len(assignments) == 1
          node = assignments[0]
          current = ast.literal_eval(node.value)
          assert isinstance(current, int) and current > 0
          lines = source.splitlines(keepends=True)
          lines[node.lineno - 1] = lines[node.lineno - 1].replace(
              f"CURRENT_SCHEMA_VERSION = {current}",
              f"CURRENT_SCHEMA_VERSION = {current + 1}",
              1,
          )
          path.write_text("".join(lines))
          PY
          git -C /tmp/ocpp-csms-schema-advance add src/ocpp_csms/schema.py
          git -C /tmp/ocpp-csms-schema-advance -c user.name='CI Schema Fixture' -c user.email='ci@example.invalid' commit -m 'test fixture: advance schema'
          (cd /tmp/ocpp-csms-schema-advance && bash tests/deployment/integration.sh)

      - name: Show service logs on failure
        if: failure()
        run: sudo journalctl -u ocpp-csms.service --no-pager -n 100 || true


  ci:
    name: CI
    needs:
      - changes
      - docs
      - test
      - ubuntu
      - ansible
      - ansible_integration
      - ansible_schema_advance
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Require successful CI
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          DOCS_RESULT: ${{ needs.docs.result }}
          TEST_RESULT: ${{ needs.test.result }}
          UBUNTU_RESULT: ${{ needs.ubuntu.result }}
          ANSIBLE_RESULT: ${{ needs.ansible.result }}
          ANSIBLE_INTEGRATION_RESULT: ${{ needs.ansible_integration.result }}
          ANSIBLE_SCHEMA_ADVANCE_RESULT: ${{ needs.ansible_schema_advance.result }}
        run: |
          set -euo pipefail

          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change-scope validation did not succeed: $CHANGES_RESULT"
            exit 1
          fi

          if [[ "$DOCS_ONLY" == "true" ]]; then
            if [[ "$DOCS_RESULT" != "success" ]]; then
              echo "Documentation validation did not succeed: $DOCS_RESULT"
              exit 1
            fi
            exit 0
          fi

          if [[ "$TEST_RESULT" != "success" ]]; then
            echo "Test matrix did not succeed: $TEST_RESULT"
            exit 1
          fi

          if [[ "$UBUNTU_RESULT" != "success" ]]; then
            echo "Ubuntu 24.04 / Python 3.13 tests did not succeed: $UBUNTU_RESULT"
            exit 1
          fi

          if [[ "$ANSIBLE_INTEGRATION_RESULT" != "success" ]]; then
            echo "Ansible integration did not succeed: $ANSIBLE_INTEGRATION_RESULT"
            exit 1
          fi

          if [[ "$ANSIBLE_SCHEMA_ADVANCE_RESULT" != "success" ]]; then
            echo "Schema advancement integration did not succeed: $ANSIBLE_SCHEMA_ADVANCE_RESULT"
            exit 1
          fi

          if [[ "$ANSIBLE_RESULT" != "success" ]]; then
            echo "Ansible validation did not succeed: $ANSIBLE_RESULT"
            exit 1
          fi
