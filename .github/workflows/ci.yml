name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  changes:
    name: Validate change scope
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate documentation-only changes
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          docs_only=true
          if (( ${#changed[@]} == 0 )); then
            docs_only=false
          fi

          for path in "${changed[@]}"; do
            case "$path" in
              README.md|docs/*|*.md)
                ;;
              *)
                docs_only=false
                break
                ;;
            esac
          done

          printf 'Changed files:\n'
          printf '  %s\n' "${changed[@]}"
          echo "docs_only=$docs_only" | tee -a "$GITHUB_OUTPUT"

  docs:
    name: Documentation only
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Documentation-only change validated
        run: echo "Only documentation files changed; full CI is not required."

  test:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        include:
          - name: Debian 12 / Python 3.11
            image: python:3.11-bookworm
          - name: Debian 13 / Python 3.13
            image: python:3.13-trixie
    container:
      image: ${{ matrix.image }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Install Ansible validation tools
        run: python -m pip install ansible-core ansible-lint

      - name: Appliance script syntax
        run: sh -n deploy.sh

      - name: Installed command smoke
        run: |
          ocpp-csms --help >/dev/null
          ocpp-discover --help >/dev/null

      - name: Ansible syntax check
        run: ansible-playbook ansible/playbooks/satellite.yml -i localhost, --syntax-check

      - name: Ansible lint
        run: ansible-lint --profile basic ansible/

      - name: Ansible contract tests
        run: python -m pytest tests/ansible

      - name: CSMS tests
        run: python -m pytest tests --ignore=tests/ocpp_discover --ignore=tests/ansible

      - name: Discover tests
        run: python -m pytest tests/ocpp_discover
