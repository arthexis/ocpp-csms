name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        include:
          - name: Debian 12 / Python 3.11
            image: python:3.11-bookworm
          - name: Debian 13 / Python 3.13
            image: python:3.13-trixie
    container:
      image: ${{ matrix.image }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Install Ansible validation tools
        run: python -m pip install ansible-core ansible-lint

      - name: Appliance script syntax
        run: sh -n deploy.sh

      - name: Installed command smoke
        run: |
          ocpp-csms --help >/dev/null
          ocpp-discover --help >/dev/null

      - name: Ansible syntax check
        run: ansible-playbook ansible/playbooks/satellite.yml -i localhost, --syntax-check

      - name: Ansible lint
        run: ansible-lint --profile basic ansible/

      - name: Ansible contract tests
        run: python -m pytest tests/ansible

      - name: CSMS tests
        run: python -m pytest tests --ignore=tests/ocpp_discover --ignore=tests/ansible

      - name: Discover tests
        run: python -m pytest tests/ocpp_discover
