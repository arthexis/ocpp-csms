name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  push:
    branches:
      - main

jobs:
  changes:
    name: Validate change scope
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify deploy.sh is executable in Git and checkout
        shell: bash
        run: |
          set -euo pipefail
          mode="$(git ls-files --stage -- deploy.sh | awk '{print $1}')"
          if [[ "$mode" != "100755" ]]; then
            echo "::error::deploy.sh must be tracked with Git mode 100755 (found: ${mode:-missing})"
            exit 1
          fi
          test -x deploy.sh || { echo "::error::deploy.sh is not executable in checkout"; exit 1; }

      - name: Validate documentation-only changes
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          docs_only=true
          if (( ${#changed[@]} == 0 )); then
            docs_only=false
          fi

          for path in "${changed[@]}"; do
            case "$path" in
              README.md|docs/*|*.md)
                ;;
              *)
                docs_only=false
                break
                ;;
            esac
          done

          printf 'Changed files:\n'
          printf '  %s\n' "${changed[@]}"
          echo "docs_only=$docs_only" | tee -a "$GITHUB_OUTPUT"

  docs:
    name: Documentation only
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Documentation-only change validated
        run: echo "Only documentation files changed; full CI is not required."

  test:
    name: ${{ matrix.platform }} / ${{ matrix.suite }}
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        platform:
          - Debian 12 / Python 3.11
          - Debian 13 / Python 3.13
        suite:
          - CSMS tests
          - Discover tests
        include:
          - platform: Debian 12 / Python 3.11
            image: python:3.11-bookworm
          - platform: Debian 13 / Python 3.13
            image: python:3.13-trixie
    container:
      image: ${{ matrix.image }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Installed command smoke
        if: matrix.suite == 'CSMS tests'
        run: |
          ocpp-csms --help >/dev/null
          ocpp-discover --help >/dev/null

      - name: CSMS tests
        if: matrix.suite == 'CSMS tests'
        run: timeout --signal=TERM --kill-after=10s 300s python -m pytest -n 2 -vv tests --ignore=tests/ocpp_discover --ignore=tests/ansible

      - name: Discover tests
        if: matrix.suite == 'Discover tests'
        run: timeout --signal=TERM --kill-after=10s 300s python -m pytest -vv tests/ocpp_discover


  
  ubuntu:
    name: Ubuntu 24.04 / Python 3.13 / ${{ matrix.suite }}
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        suite: [CSMS tests, Discover tests]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Installed command smoke
        if: matrix.suite == 'CSMS tests'
        run: |
          ocpp-csms --help >/dev/null
          ocpp-discover --help >/dev/null

      - name: CSMS tests
        if: matrix.suite == 'CSMS tests'
        run: timeout --signal=TERM --kill-after=10s 300s python -m pytest -n 2 -vv tests --ignore=tests/ocpp_discover --ignore=tests/ansible

      - name: Discover tests
        if: matrix.suite == 'Discover tests'
        run: timeout --signal=TERM --kill-after=10s 300s python -m pytest -vv tests/ocpp_discover


  ansible:
    name: Ansible validation
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Appliance script syntax
        run: sh -n deploy.sh

      - name: Install Ansible validation tools
        run: python -m pip install ansible-core ansible-lint

      - name: Ansible syntax check
        run: |
          ansible-playbook ansible/playbooks/install.yml -i localhost, --syntax-check
          ansible-playbook ansible/playbooks/expose.yml -i localhost, --syntax-check
          ansible-playbook ansible/playbooks/uninstall.yml -i localhost, --syntax-check

      - name: Ansible lint
        run: ansible-lint --profile basic ansible/



  ansible_deploy:
    name: Ansible end-to-end deployment
    timeout-minutes: 25
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Ansible
        run: python3 -m pip install --user ansible-core

      - name: Verify unprivileged deployment prerequisites
        run: |
          test "$(id -u)" -ne 0
          sudo -n true
          systemctl --version
          command -v ansible-playbook

      - name: Deploy OCPP CSMS using supported entrypoint
        run: ./deploy.sh

      - name: Verify deployed service and storage
        run: |
          set -euo pipefail
          sudo systemctl is-active --quiet ocpp-csms.service
          sudo systemctl is-enabled --quiet ocpp-csms.service
          /usr/local/bin/ocpp-csms --help >/dev/null
          /usr/local/bin/ocpp-csms status
          test -L "$HOME/.local/share/ocpp-csms/current"
          # The running service must use the prepared versioned database, not the storage root.
          unit_exec="$(sudo systemctl show ocpp-csms.service -p ExecStart --value)"
          [[ "$unit_exec" == *"--data-dir"* ]]
          [[ "$unit_exec" == *"$HOME/ocpp-csms-data/schemas/"* ]]
          test ! -e "$HOME/ocpp-csms-data/ocpp-csms.sqlite3"
          sudo systemctl show ocpp-csms.service -p MainPID --value | grep -Eq '^[1-9][0-9]*$'
          sudo systemctl show ocpp-csms.service -p MainPID --value > /tmp/ocpp-csms-before.pid

      - name: Re-run deployment without restarting healthy service
        run: |
          set -euo pipefail
          ./deploy.sh
          sudo systemctl is-active --quiet ocpp-csms.service
          test "$(sudo systemctl show ocpp-csms.service -p MainPID --value)" = "$(cat /tmp/ocpp-csms-before.pid)"

      - name: Show deployment journal on failure
        if: failure()
        run: sudo journalctl -u ocpp-csms.service --no-pager -n 100 || true


  ci:
    name: CI
    needs:
      - changes
      - docs
      - test
      - ubuntu
      - ansible
      - ansible_deploy
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Require successful CI
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          DOCS_RESULT: ${{ needs.docs.result }}
          TEST_RESULT: ${{ needs.test.result }}
          UBUNTU_RESULT: ${{ needs.ubuntu.result }}
          ANSIBLE_RESULT: ${{ needs.ansible.result }}
          ANSIBLE_DEPLOY_RESULT: ${{ needs.ansible_deploy.result }}
        run: |
          set -euo pipefail

          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change-scope validation did not succeed: $CHANGES_RESULT"
            exit 1
          fi

          if [[ "$DOCS_ONLY" == "true" ]]; then
            if [[ "$DOCS_RESULT" != "success" ]]; then
              echo "Documentation validation did not succeed: $DOCS_RESULT"
              exit 1
            fi
            exit 0
          fi

          if [[ "$TEST_RESULT" != "success" ]]; then
            echo "Test matrix did not succeed: $TEST_RESULT"
            exit 1
          fi

          if [[ "$UBUNTU_RESULT" != "success" ]]; then
            echo "Ubuntu 24.04 / Python 3.13 tests did not succeed: $UBUNTU_RESULT"
            exit 1
          fi

          if [[ "$ANSIBLE_DEPLOY_RESULT" != "success" ]]; then
            echo "Ansible end-to-end deployment did not succeed: $ANSIBLE_DEPLOY_RESULT"
            exit 1
          fi

          if [[ "$ANSIBLE_RESULT" != "success" ]]; then
            echo "Ansible validation did not succeed: $ANSIBLE_RESULT"
            exit 1
          fi
