---
- name: Validate public WSS proxy deployment
  ansible.builtin.assert:
    that:
      - ocpp_csms_expose is match('^[a-z0-9]+([.-][a-z0-9]+)*$')
      - "'.' in ocpp_csms_expose"
      - ocpp_expose_upstream_port | int > 0
    fail_msg: Expose requires a valid FQDN and CSMS upstream port.

- name: Verify Basic credentials are configured
  ansible.builtin.command:
    argv: ["{{ ocpp_expose_runtime_command }}", auth, status]
  register: ocpp_expose_auth
  changed_when: false

- name: Reject anonymous public CSMS
  ansible.builtin.assert:
    that:
      - (ocpp_expose_auth.stdout | from_json).mode == 'basic'
    fail_msg: Configure auth first with ocpp-csms auth basic --limit 3d.

- name: Install nginx and Certbot
  become: true
  ansible.builtin.apt:
    name: [nginx, certbot]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create restricted ACME challenge webroot
  become: true
  ansible.builtin.file:
    path: /var/www/ocpp-csms-acme
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Check existing fullchain certificate
  become: true
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ ocpp_csms_expose }}/fullchain.pem"
  register: ocpp_expose_existing_cert

- name: Require contact email for first certificate issue
  ansible.builtin.assert:
    that:
      - ocpp_csms_certbot_email | default('') is match('^[^ @]+@[^ @]+\\.[^ @]+$')
    fail_msg: First issuance requires --email valid@example.com (existing certs do not).
  when:
    - not (ocpp_expose_existing_cert.stat.exists | default(false))
    - not (ocpp_csms_no_certbot | default(false) | bool)

- name: Check for an existing nginx site before ACME bootstrap
  become: true
  ansible.builtin.stat:
    path: "/etc/nginx/sites-available/{{ ocpp_csms_expose }}"
  register: ocpp_expose_bootstrap_site
  when: not (ocpp_expose_existing_cert.stat.exists | default(false))

- name: Refuse to overwrite a live site during first certificate issuance
  ansible.builtin.assert:
    that:
      - not (ocpp_expose_bootstrap_site.stat.exists | default(false))
    fail_msg: >-
      An nginx site already exists for this hostname without a certificate.
      Preserve it and provision a certificate before enabling exposure.
  when: not (ocpp_expose_existing_cert.stat.exists | default(false))

- name: Install HTTP-only ACME bootstrap nginx site
  become: true
  ansible.builtin.template:
    src: ocpp-csms-acme.conf.j2
    dest: "/etc/nginx/sites-available/{{ ocpp_csms_expose }}"
    mode: "0644"
  when: not (ocpp_expose_existing_cert.stat.exists | default(false))

- name: Enable ACME bootstrap site
  become: true
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ ocpp_csms_expose }}"
    dest: "/etc/nginx/sites-enabled/{{ ocpp_csms_expose }}"
    state: link
  when: not (ocpp_expose_existing_cert.stat.exists | default(false))

- name: Validate bootstrap nginx
  become: true
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Start nginx for HTTP-01 challenge
  become: true
  ansible.builtin.systemd_service:
    name: nginx
    state: reloaded
    enabled: true
  when: not (ocpp_expose_existing_cert.stat.exists | default(false))

- name: Issue a certificate for the exact hostname using webroot
  become: true
  ansible.builtin.command:
    argv:
      - certbot
      - certonly
      - --webroot
      - --webroot-path
      - /var/www/ocpp-csms-acme
      - --cert-name
      - "{{ ocpp_csms_expose }}"
      - -d
      - "{{ ocpp_csms_expose }}"
      - --email
      - "{{ ocpp_csms_certbot_email }}"
      - --agree-tos
      - --non-interactive
      - --keep-until-expiring
  when:
    - not (ocpp_expose_existing_cert.stat.exists | default(false))
    - not (ocpp_csms_no_certbot | default(false) | bool)
  no_log: false

- name: Verify certificate files after issuance or external provisioning
  become: true
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "/etc/letsencrypt/live/{{ ocpp_csms_expose }}/fullchain.pem"
    - "/etc/letsencrypt/live/{{ ocpp_csms_expose }}/privkey.pem"
  register: ocpp_expose_cert_files

- name: Stop safely when TLS certificate is unavailable
  ansible.builtin.assert:
    that:
      - ocpp_expose_cert_files.results | map(attribute='stat.exists') | min
    fail_msg: Valid hostname certificate required; public HTTPS/WSS site not installed.

- name: Validate hostname and expiry of installed certificate
  become: true
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -in
      - "/etc/letsencrypt/live/{{ ocpp_csms_expose }}/fullchain.pem"
      - -noout
      - -checkend
      - "86400"
  changed_when: false

- name: Verify certificate matches the exact public DNS hostname
  become: true
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -in
      - "/etc/letsencrypt/live/{{ ocpp_csms_expose }}/fullchain.pem"
      - -noout
      - -checkhost
      - "{{ ocpp_csms_expose }}"
  register: ocpp_expose_hostname_check
  changed_when: false
  failed_when: "'does match certificate' not in ocpp_expose_hostname_check.stdout"

- name: Ensure nginx supports native DAV uploads
  become: true
  ansible.builtin.shell: nginx -V 2>&1 | grep -q -- '--with-http_dav_module'
  changed_when: false

- name: Install ACL tools for restricted uploads
  become: true
  ansible.builtin.apt:
    name: acl
    state: present

- name: Create isolated HTTPS diagnostic upload directory
  become: true
  ansible.builtin.file:
    path: /var/lib/ocpp-csms/diagnostics
    state: directory
    owner: "{{ ansible_user_id }}"
    group: www-data
    mode: "2770"

- name: Grant the operator access to nginx-created diagnostic files
  become: true
  ansible.builtin.command:
    argv:
      - setfacl
      - -m
      - "u:{{ ansible_user_id }}:rwx,d:u:{{ ansible_user_id }}:rwx,d:g:www-data:rwx"
      - /var/lib/ocpp-csms/diagnostics
  changed_when: false

- name: Configure HTTPS diagnostic hostname for the CLI
  become: true
  ansible.builtin.file:
    path: /etc/ocpp-csms
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Publish configured HTTPS diagnostic endpoint
  become: true
  ansible.builtin.copy:
    dest: /etc/ocpp-csms/diagnostics-https.json
    content: "{{ {'hostname': ocpp_csms_expose} | to_json }}"
    owner: root
    group: root
    mode: "0644"

- name: Install HTTPS diagnostic cleanup service
  become: true
  ansible.builtin.copy:
    dest: /etc/systemd/system/ocpp-csms-diagnostics-prune.service
    mode: "0644"
    content: |
      [Unit]
      Description=Prune expired OCPP diagnostic uploads
      [Service]
      Type=oneshot
      User={{ ansible_user_id }}
      ExecStart={{ ocpp_expose_runtime_command }} diagnose prune

- name: Install HTTPS diagnostic cleanup timer
  become: true
  ansible.builtin.copy:
    dest: /etc/systemd/system/ocpp-csms-diagnostics-prune.timer
    mode: "0644"
    content: |
      [Unit]
      Description=Prune expired OCPP diagnostic uploads periodically
      [Timer]
      OnCalendar=hourly
      Persistent=true
      [Install]
      WantedBy=timers.target

- name: Enable HTTPS diagnostic cleanup timer
  become: true
  ansible.builtin.systemd_service:
    name: ocpp-csms-diagnostics-prune.timer
    state: started
    enabled: true
    daemon_reload: true

- name: Install socket-activated POST receiver service
  become: true
  ansible.builtin.copy:
    dest: /etc/systemd/system/ocpp-csms-diagnose.service
    mode: "0644"
    content: |
      [Unit]
      Description=OCPP diagnostic POST receiver
      Requires=ocpp-csms-diagnose.socket
      After=ocpp-csms-diagnose.socket
      [Service]
      Type=simple
      User={{ ansible_user_id }}
      Group=www-data
      ExecStart={{ ansible_env.HOME }}/.local/share/ocpp-csms/current/venv/bin/python -m ocpp_csms.diagnose_receiver
      NoNewPrivileges=true
      PrivateTmp=true
      ProtectSystem=strict
      ReadWritePaths=/var/lib/ocpp-csms/diagnostics
      ProtectHome=read-only
      MemoryMax=384M
      TasksMax=32

- name: Install on-demand POST receiver socket
  become: true
  ansible.builtin.copy:
    dest: /etc/systemd/system/ocpp-csms-diagnose.socket
    mode: "0644"
    content: |
      [Unit]
      Description=OCPP diagnostic HTTP POST socket
      [Socket]
      ListenStream=/run/ocpp-csms-diagnose.sock
      SocketMode=0660
      SocketUser=root
      SocketGroup=www-data
      RemoveOnStop=true
      [Install]
      WantedBy=sockets.target

- name: Activate on-demand POST receiver socket
  become: true
  ansible.builtin.systemd_service:
    name: ocpp-csms-diagnose.socket
    enabled: true
    state: started
    daemon_reload: true

- name: Check previous nginx site for rollback
  become: true
  ansible.builtin.stat:
    path: "/etc/nginx/sites-available/{{ ocpp_csms_expose }}"
  register: ocpp_expose_previous_site

- name: Snapshot existing nginx site before promotion
  become: true
  ansible.builtin.copy:
    src: "/etc/nginx/sites-available/{{ ocpp_csms_expose }}"
    dest: "/etc/nginx/sites-available/.{{ ocpp_csms_expose }}.previous"
    remote_src: true
    mode: "0644"
  when: ocpp_expose_previous_site.stat.exists | default(false)

- name: Promote validated public WSS site with rollback
  block:
    - name: Render hostname-isolated WSS nginx site
      become: true
      ansible.builtin.template:
        src: ocpp-csms-site.conf.j2
        dest: "/etc/nginx/sites-available/{{ ocpp_csms_expose }}"
        mode: "0644"

    - name: Enable hostname-isolated WSS site
      become: true
      ansible.builtin.file:
        src: "/etc/nginx/sites-available/{{ ocpp_csms_expose }}"
        dest: "/etc/nginx/sites-enabled/{{ ocpp_csms_expose }}"
        state: link

    - name: Validate complete nginx configuration before reload
      become: true
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Activate TLS-terminating nginx
      become: true
      ansible.builtin.systemd_service:
        name: nginx
        state: reloaded
        enabled: true
    - name: Verify diagnostic receiver socket is enabled and listening
      become: true
      ansible.builtin.command:
        argv: [systemctl, is-active, ocpp-csms-diagnose.socket]
      register: ocpp_expose_diagnose_socket_state
      changed_when: false
      failed_when: ocpp_expose_diagnose_socket_state.stdout | trim != 'active'

    - name: Confirm socket activation serves the receiver HTTP protocol
      become: true
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - |
            import socket
            with socket.socket(socket.AF_UNIX, socket.SOCK_STREAM) as sock:
                sock.settimeout(10)
                sock.connect("/run/ocpp-csms-diagnose.sock")
                sock.sendall(b"GET / HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n")
                response = sock.recv(256)
            if not response.startswith(b"HTTP/1.1 405 "):
                raise SystemExit("diagnose receiver did not respond with HTTP 405")
      changed_when: false

  rescue:
    - name: Restore previous nginx site
      become: true
      ansible.builtin.copy:
        src: "/etc/nginx/sites-available/.{{ ocpp_csms_expose }}.previous"
        dest: "/etc/nginx/sites-available/{{ ocpp_csms_expose }}"
        remote_src: true
        mode: "0644"
      when: ocpp_expose_previous_site.stat.exists | default(false)

    - name: Disable unvalidated site when there was no predecessor
      become: true
      ansible.builtin.file:
        path: "/etc/nginx/sites-enabled/{{ ocpp_csms_expose }}"
        state: absent
      when: not (ocpp_expose_previous_site.stat.exists | default(false))

    - name: Check restored nginx configuration
      become: true
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Reload restored nginx configuration
      become: true
      ansible.builtin.systemd_service:
        name: nginx
        state: reloaded

    - name: Stop after failed public WSS promotion
      ansible.builtin.fail:
        msg: WSS promotion failed; previous nginx site restored where available.

- name: Persist successfully activated exposure hostname
  become: true
  ansible.builtin.file:
    path: /etc/ocpp-csms
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Save authoritative exposure selection
  become: true
  ansible.builtin.copy:
    dest: /etc/ocpp-csms/exposure.toml
    content: "hostname = {{ ocpp_csms_expose | to_json }}\n"
    owner: root
    group: root
    mode: "0644"

- name: Configure certificate renewal nginx reload hook
  become: true
  ansible.builtin.template:
    src: ocpp-csms-renew-hook.sh.j2
    dest: /etc/letsencrypt/renewal-hooks/deploy/ocpp-csms-nginx.sh
    mode: "0755"
  when: not (ocpp_csms_no_certbot | default(false) | bool)

- name: Enable automatic Certbot renewals when managed by this deployment
  become: true
  ansible.builtin.systemd_service:
    name: certbot.timer
    state: started
    enabled: true
  when: not (ocpp_csms_no_certbot | default(false) | bool)

# Opt-in HTTPS diagnostic downloads. No additional systemd services.
- name: Validate optional diagnostic download hostname
  ansible.builtin.assert:
    that:
      - ocpp_expose_diagnose_download_host is match('^[a-z0-9]+([.-][a-z0-9]+)*$')
      - "'.' in ocpp_expose_diagnose_download_host"
      - ocpp_expose_diagnose_download_host != ocpp_csms_expose
    fail_msg: Download hostname must be a distinct FQDN.
  when: ocpp_expose_diagnose_download_host | length > 0

- name: Prepare diagnostic download directories
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: /etc/nginx/ocpp-csms-diagnose-download, group: root, mode: "0755"}
    - {path: /etc/ocpp-csms/diagnose-download, group: www-data, mode: "0750"}
    - {path: /var/lib/ocpp-csms/diagnose-downloads, group: www-data, mode: "0750"}
  when: ocpp_expose_diagnose_download_host | length > 0

- name: Check existing diagnostic download certificate
  become: true
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ ocpp_expose_diagnose_download_host }}/fullchain.pem"
  register: ocpp_expose_download_cert
  when: ocpp_expose_diagnose_download_host | length > 0

- name: Install diagnostic download ACME bootstrap
  become: true
  ansible.builtin.template:
    src: ocpp-csms-diagnose-download-acme.conf.j2
    dest: "/etc/nginx/sites-available/{{ ocpp_expose_diagnose_download_host }}"
    mode: "0644"
  when:
    - ocpp_expose_diagnose_download_host | length > 0
    - not (ocpp_expose_download_cert.stat.exists | default(false))

- name: Enable diagnostic download site
  become: true
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ ocpp_expose_diagnose_download_host }}"
    dest: "/etc/nginx/sites-enabled/{{ ocpp_expose_diagnose_download_host }}"
    state: link
  when: ocpp_expose_diagnose_download_host | length > 0

- name: Validate nginx before diagnostic download certificate issuance
  become: true
  ansible.builtin.command: nginx -t
  changed_when: false
  when: ocpp_expose_diagnose_download_host | length > 0

- name: Activate HTTP challenge site for diagnostic downloads
  become: true
  ansible.builtin.systemd_service:
    name: nginx
    state: reloaded
  when:
    - ocpp_expose_diagnose_download_host | length > 0
    - not (ocpp_expose_download_cert.stat.exists | default(false))

- name: Issue diagnostic download certificate
  become: true
  ansible.builtin.command:
    argv:
      - certbot
      - certonly
      - --webroot
      - -w
      - /var/www/ocpp-csms-acme
      - -d
      - "{{ ocpp_expose_diagnose_download_host }}"
      - --email
      - "{{ ocpp_csms_certbot_email }}"
      - --agree-tos
      - --non-interactive
  when:
    - ocpp_expose_diagnose_download_host | length > 0
    - not (ocpp_expose_download_cert.stat.exists | default(false))
    - not (ocpp_csms_no_certbot | default(false) | bool)

- name: Ensure diagnostic download certificate is available
  become: true
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ ocpp_expose_diagnose_download_host }}/fullchain.pem"
  register: ocpp_expose_download_cert_ready
  when: ocpp_expose_diagnose_download_host | length > 0

- name: Refuse diagnostic download site without TLS certificate
  ansible.builtin.assert:
    that: ocpp_expose_download_cert_ready.stat.exists | default(false)
    fail_msg: Diagnostic download certificate unavailable; site remains HTTP 404 only.
  when: ocpp_expose_diagnose_download_host | length > 0

- name: Install TLS diagnostic download nginx site
  become: true
  ansible.builtin.template:
    src: ocpp-csms-diagnose-download.conf.j2
    dest: "/etc/nginx/sites-available/{{ ocpp_expose_diagnose_download_host }}"
    mode: "0644"
  when: ocpp_expose_diagnose_download_host | length > 0

- name: Configure CLI diagnostic download hostname
  become: true
  ansible.builtin.copy:
    dest: /etc/ocpp-csms/diagnose-download.json
    content: "{{ {'hostname': ocpp_expose_diagnose_download_host} | to_json }}"
    owner: root
    group: root
    mode: "0644"
  when: ocpp_expose_diagnose_download_host | length > 0

- name: Activate diagnostic download nginx site
  become: true
  ansible.builtin.command: nginx -t
  changed_when: false
  when: ocpp_expose_diagnose_download_host | length > 0

- name: Reload nginx for diagnostic downloads
  become: true
  ansible.builtin.systemd_service:
    name: nginx
    state: reloaded
  when: ocpp_expose_diagnose_download_host | length > 0
