---
- name: Inspect current release link
  ansible.builtin.stat:
    path: "{{ ocpp_csms_current_link }}"
    follow: false
  register: ocpp_csms_current_state

- name: Inspect candidate systemd unit
  ansible.builtin.stat:
    path: "{{ ocpp_csms_candidate_service_path }}"
    checksum_algorithm: sha256
  register: ocpp_csms_candidate_service_state

- name: Inspect live systemd unit
  become: true
  ansible.builtin.stat:
    path: "{{ ocpp_csms_service_path }}"
    checksum_algorithm: sha256
  register: ocpp_csms_live_service_state

- name: Decide whether release activation is required
  ansible.builtin.set_fact:
    ocpp_csms_activation_required: >-
      {{
        (ocpp_csms_schema_action == 'upgrade')
        or (ocpp_csms_incumbent_service | length > 0)
        or (not (ocpp_csms_current_state.stat.islnk | default(false)))
        or ((ocpp_csms_current_state.stat.lnk_source | default('')) != ocpp_csms_release_dir)
        or (not (ocpp_csms_live_service_state.stat.exists | default(false)))
        or ((ocpp_csms_live_service_state.stat.checksum | default('')) !=
            (ocpp_csms_candidate_service_state.stat.checksum | default('candidate-missing')))
      }}

- name: Save final preflight payload for handoff
  ansible.builtin.copy:
    dest: "{{ ocpp_csms_final_preflight_path }}"
    content: "{{ ocpp_csms_final_preflight.stdout }}\n"
    mode: "0600"
  when: ocpp_csms_activation_required | bool

- name: Capture charger reconnect baseline
  ansible.builtin.command:
    argv:
      - "{{ ocpp_csms_release_venv }}/bin/python"
      - -m
      - ocpp_csms.install_cutover
      - capture-baseline
      - --data-dir
      - "{{ ocpp_csms_data_dir }}"
      - --preflight-json
      - "{{ ocpp_csms_final_preflight_path }}"
      - --output
      - "{{ ocpp_csms_reconnect_baseline_path }}"
  changed_when: true
  when: ocpp_csms_activation_required | bool

- name: Preserve previous live systemd unit
  become: true
  ansible.builtin.copy:
    src: "{{ ocpp_csms_service_path }}"
    dest: "{{ ocpp_csms_previous_service_path }}"
    remote_src: true
    mode: "0644"
  when:
    - ocpp_csms_activation_required | bool
    - ocpp_csms_live_service_state.stat.exists | default(false)

- name: Remove stale previous service snapshot on first install
  ansible.builtin.file:
    path: "{{ ocpp_csms_previous_service_path }}"
    state: absent
  when:
    - ocpp_csms_activation_required | bool
    - not (ocpp_csms_live_service_state.stat.exists | default(false))

# Downtime starts here. An observed incumbent OCPP listener is stopped only after
# the candidate, systemd unit, final safety gate and schema decision are ready.
- name: Activate and verify OCPP CSMS handoff
  when: ocpp_csms_activation_required | bool
  block:
    - name: Stop incumbent OCPP service listener at cutover
      ansible.builtin.include_tasks: incumbent_stop.yml

    - name: Stop existing OCPP CSMS service
      become: true
      ansible.builtin.systemd_service:
        name: "{{ ocpp_csms_service_name }}"
        state: stopped
      when: ocpp_csms_live_service_state.stat.exists | default(false)

    - name: Upgrade database schema after service stop
      ansible.builtin.command:
        argv:
          - "{{ ocpp_csms_release_venv }}/bin/python"
          - -m
          - ocpp_csms.install_cutover
          - schema-upgrade
          - --data-dir
          - "{{ ocpp_csms_data_dir }}"
      when: ocpp_csms_schema_action == 'upgrade'

    - name: Verify database schema and SQLite integrity before activation
      ansible.builtin.command:
        argv:
          - "{{ ocpp_csms_release_venv }}/bin/python"
          - -m
          - ocpp_csms.install_cutover
          - schema-verify
          - --data-dir
          - "{{ ocpp_csms_data_dir }}"
      changed_when: false
      when: ocpp_csms_schema_action != 'create'

    - name: Install live OCPP CSMS systemd unit
      become: true
      ansible.builtin.copy:
        src: "{{ ocpp_csms_candidate_service_path }}"
        dest: "{{ ocpp_csms_service_path }}"
        remote_src: true
        mode: "0644"
      notify: Reload systemd daemon

    - name: Apply pending systemd daemon reload
      ansible.builtin.meta: flush_handlers

    - name: Initialize OCPP CSMS storage with candidate release
      ansible.builtin.command:
        argv:
          - "{{ ocpp_csms_release_command }}"
          - --data-dir
          - "{{ ocpp_csms_data_dir }}"
          - init

    - name: Inspect initialized OCPP CSMS database
      ansible.builtin.stat:
        path: "{{ ocpp_csms_database_path }}"
      register: ocpp_csms_database_state

    - name: Inspect initialized OCPP CSMS transaction archive
      ansible.builtin.stat:
        path: "{{ ocpp_csms_transactions_dir }}"
      register: ocpp_csms_transactions_state

    - name: Verify OCPP CSMS data directory is writable
      ansible.builtin.command:
        argv: [test, -w, "{{ ocpp_csms_data_dir }}"]
      changed_when: false

    - name: Assert initialized OCPP CSMS storage
      ansible.builtin.assert:
        that:
          - ocpp_csms_database_state.stat.exists | default(false)
          - ocpp_csms_database_state.stat.isreg | default(false)
          - ocpp_csms_transactions_state.stat.exists | default(false)
          - ocpp_csms_transactions_state.stat.isdir | default(false)
        fail_msg: OCPP CSMS init did not produce expected storage.

    - name: Enable and start candidate OCPP CSMS service
      become: true
      ansible.builtin.systemd_service:
        name: "{{ ocpp_csms_service_name }}"
        enabled: true
        state: started

    - name: Wait for OCPP CSMS listener
      ansible.builtin.wait_for:
        host: "{{ ocpp_csms_verify_host }}"
        port: "{{ ocpp_csms_port }}"
        timeout: "{{ ocpp_csms_listener_timeout }}"
        state: started

    - name: Verify candidate OCPP CSMS application status
      ansible.builtin.command:
        argv:
          - "{{ ocpp_csms_release_command }}"
          - --data-dir
          - "{{ ocpp_csms_data_dir }}"
          - status
      changed_when: false

    - name: Verify previously connected chargers reconnect
      ansible.builtin.include_tasks: reconnect_with_discover.yml

    - name: Point previous at successfully active release
      ansible.builtin.file:
        src: "{{ ocpp_csms_current_state.stat.lnk_source }}"
        dest: "{{ ocpp_csms_previous_link }}"
        state: link
        force: true
      when:
        - ocpp_csms_current_state.stat.islnk | default(false)
        - (ocpp_csms_current_state.stat.lnk_source | default('')) != ocpp_csms_release_dir

    - name: Promote verified release to current
      ansible.builtin.file:
        src: "{{ ocpp_csms_release_dir }}"
        dest: "{{ ocpp_csms_current_link }}"
        state: link
        force: true

    # A successful takeover must not allow the incumbent listener to return on the
    # next boot and race the new CSMS for the production port.
    - name: Disable incumbent OCPP service after verified takeover
      become: true
      ansible.builtin.systemd_service:
        name: "{{ ocpp_csms_incumbent_service }}"
        enabled: false
      when: ocpp_csms_incumbent_service | length > 0

  rescue:
    # Incumbent takeover is independent of the new CSMS database. If it was the
    # production owner before cutover, restore it first even when this was the
    # first managed ocpp-csms release.
    - name: Restore incumbent OCPP service after failed takeover
      ansible.builtin.include_tasks: incumbent_restore.yml
      when: ocpp_csms_incumbent_service | length > 0

    - name: Stop failed replacement before rollback
      become: true
      ansible.builtin.systemd_service:
        name: "{{ ocpp_csms_service_name }}"
        state: stopped
      failed_when: false
      when:
        - ocpp_csms_incumbent_service | length == 0
        - ocpp_csms_schema_action != 'upgrade'
        - ocpp_csms_current_state.stat.islnk | default(false)

    - name: Restore previous live systemd unit
      become: true
      ansible.builtin.copy:
        src: "{{ ocpp_csms_previous_service_path }}"
        dest: "{{ ocpp_csms_service_path }}"
        remote_src: true
        mode: "0644"
      notify: Reload systemd daemon
      when:
        - ocpp_csms_incumbent_service | length == 0
        - ocpp_csms_schema_action != 'upgrade'
        - ocpp_csms_current_state.stat.islnk | default(false)
        - ocpp_csms_live_service_state.stat.exists | default(false)

    - name: Apply rollback systemd daemon reload
      ansible.builtin.meta: flush_handlers
      when:
        - ocpp_csms_incumbent_service | length == 0
        - ocpp_csms_schema_action != 'upgrade'
        - ocpp_csms_current_state.stat.islnk | default(false)

    - name: Restart previous OCPP CSMS service
      become: true
      ansible.builtin.systemd_service:
        name: "{{ ocpp_csms_service_name }}"
        enabled: true
        state: started
      when:
        - ocpp_csms_incumbent_service | length == 0
        - ocpp_csms_schema_action != 'upgrade'
        - ocpp_csms_current_state.stat.islnk | default(false)
        - ocpp_csms_live_service_state.stat.exists | default(false)

    - name: Verify rollback listener
      ansible.builtin.wait_for:
        host: "{{ ocpp_csms_verify_host }}"
        port: "{{ ocpp_csms_port }}"
        timeout: "{{ ocpp_csms_listener_timeout }}"
        state: started
      when:
        - ocpp_csms_incumbent_service | length == 0
        - ocpp_csms_schema_action != 'upgrade'
        - ocpp_csms_current_state.stat.islnk | default(false)
        - ocpp_csms_live_service_state.stat.exists | default(false)

    - name: Report failed incumbent OCPP service takeover after restoration
      ansible.builtin.fail:
        msg: >-
          OCPP CSMS takeover failed and incumbent OCPP service was restored:
          {{ ansible_failed_result.msg | default('verification failure') }}
      when: ocpp_csms_incumbent_service | length > 0

    - name: Report handoff failure after safe rollback
      ansible.builtin.fail:
        msg: >-
          OCPP CSMS handoff verification failed and the previous release was restored:
          {{ ansible_failed_result.msg | default('verification failure') }}
      when:
        - ocpp_csms_incumbent_service | length == 0
        - ocpp_csms_schema_action != 'upgrade'
        - ocpp_csms_current_state.stat.islnk | default(false)
        - ocpp_csms_live_service_state.stat.exists | default(false)

    - name: Report handoff failure without automatic rollback
      ansible.builtin.fail:
        msg: >-
          OCPP CSMS handoff verification failed without a restorable previous managed release:
          {{ ansible_failed_result.msg | default('verification failure') }}
      when:
        - ocpp_csms_incumbent_service | length == 0
        - >-
          (ocpp_csms_schema_action == 'upgrade')
          or not (ocpp_csms_current_state.stat.islnk | default(false))
          or not (ocpp_csms_live_service_state.stat.exists | default(false))

- name: Ensure converged OCPP CSMS service is enabled and running
  become: true
  ansible.builtin.systemd_service:
    name: "{{ ocpp_csms_service_name }}"
    enabled: true
    state: started
  when: not (ocpp_csms_activation_required | bool)

- name: Verify converged OCPP CSMS listener
  ansible.builtin.wait_for:
    host: "{{ ocpp_csms_verify_host }}"
    port: "{{ ocpp_csms_port }}"
    timeout: "{{ ocpp_csms_listener_timeout }}"
    state: started
  when: not (ocpp_csms_activation_required | bool)

- name: Verify converged OCPP CSMS application status
  ansible.builtin.command:
    argv:
      - "{{ ocpp_csms_runtime_command }}"
      - --data-dir
      - "{{ ocpp_csms_data_dir }}"
      - status
  changed_when: false
  when: not (ocpp_csms_activation_required | bool)
