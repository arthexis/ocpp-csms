---
# Legacy takeover is intentionally listener-driven. Arthexis may have other
# services on the appliance; only an active configured legacy unit whose main
# process owns a known OCPP TCP port is eligible for takeover.
- name: Inspect configured legacy Arthexis services
  become: true
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - "{{ item }}"
      - --property=ActiveState
      - --property=MainPID
  loop: "{{ ocpp_csms_legacy_arthexis_services }}"
  register: ocpp_csms_legacy_service_states
  changed_when: false
  failed_when: false

- name: Inspect processes owning known legacy OCPP listeners
  become: true
  ansible.builtin.shell: >-
    set -o pipefail;
    ss -H -ltnp 'sport = :{{ item }}' 2>/dev/null |
    sed -n 's/.*pid=\([0-9][0-9]*\).*/\1/p' | head -n 1
  args:
    executable: /bin/bash
  loop: "{{ ocpp_csms_legacy_arthexis_ports | unique }}"
  register: ocpp_csms_legacy_listener_states
  changed_when: false

- name: Initialize legacy Arthexis takeover state
  ansible.builtin.set_fact:
    ocpp_csms_legacy_arthexis_service: ""
    ocpp_csms_legacy_arthexis_port: 0

- name: Match active legacy Arthexis service to OCPP listener
  ansible.builtin.set_fact:
    ocpp_csms_legacy_arthexis_service: "{{ item.0.item }}"
    ocpp_csms_legacy_arthexis_port: "{{ item.1.item | int }}"
  vars:
    ocpp_csms_legacy_state_lines: "{{ item.0.stdout_lines | default([]) }}"
    ocpp_csms_legacy_main_pid_line: >-
      {{
        (ocpp_csms_legacy_state_lines
         | select('match', '^MainPID=[0-9]+$')
         | list
         | first)
        | default('MainPID=')
      }}
    ocpp_csms_legacy_main_pid: "{{ ocpp_csms_legacy_main_pid_line | regex_replace('^MainPID=', '') }}"
  when:
    - ocpp_csms_legacy_arthexis_service | length == 0
    - item.0.rc | default(1) == 0
    - "'ActiveState=active' in ocpp_csms_legacy_state_lines"
    - ocpp_csms_legacy_main_pid | length > 0
    - item.1.stdout | length > 0
    - ocpp_csms_legacy_main_pid == item.1.stdout
  loop: "{{ ocpp_csms_legacy_service_states.results | product(ocpp_csms_legacy_listener_states.results) | list }}"

- name: Report legacy Arthexis takeover preflight
  ansible.builtin.debug:
    msg: >-
      {{
        'legacy Arthexis OCPP listener detected: ' ~ ocpp_csms_legacy_arthexis_service ~
        ' on port ' ~ (ocpp_csms_legacy_arthexis_port | string)
        if ocpp_csms_legacy_arthexis_service | length > 0
        else 'no legacy Arthexis OCPP listener detected'
      }}
