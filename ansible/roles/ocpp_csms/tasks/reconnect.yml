---
# Reconnection verification only. OCPP Discover recovers independently.
- name: Verify managed charger reconnect
  ansible.builtin.command:
    argv:
      - "{{ ocpp_csms_release_venv }}/bin/python"
      - -m
      - ocpp_csms.install_cutover
      - wait-reconnect
      - --data-dir
      - "{{ ocpp_csms_data_dir }}"
      - --baseline
      - "{{ ocpp_csms_reconnect_baseline_path }}"
      - --timeout
      - "{{ ocpp_csms_reconnect_timeout }}"
  changed_when: false
  when: ocpp_csms_incumbent_service | length == 0

- name: Verify takeover charger reconnect
  ansible.builtin.command:
    argv:
      - "{{ ocpp_csms_release_venv }}/bin/python"
      - -m
      - ocpp_csms.install_cutover
      - wait-any
      - --data-dir
      - "{{ ocpp_csms_data_dir }}"
      - --timeout
      - "{{ ocpp_csms_reconnect_timeout }}"
  changed_when: false
  when: ocpp_csms_incumbent_service | length > 0
