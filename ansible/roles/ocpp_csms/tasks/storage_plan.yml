---
# B3.2 read-only discovery. Do not prepare or switch storage during staging.
- name: Plan schema-versioned storage without mutation
  ansible.builtin.command:
    argv:
      - "{{ ocpp_csms_release_venv }}/bin/python"
      - -m
      - ocpp_csms.install_cutover
      - storage-plan
      - --storage-root
      - "{{ ocpp_csms_data_dir }}"
  register: ocpp_csms_storage_plan
  changed_when: false

- name: Capture schema-versioned storage plan
  ansible.builtin.set_fact:
    ocpp_csms_storage_selection: "{{ ocpp_csms_storage_plan.stdout | from_json }}"
