---
- name: Verify actual writer storage before publishing provider
  ansible.builtin.command:
    argv:
      - "{{ ocpp_csms_release_venv }}/bin/python"
      - -m
      - ocpp_csms.active_storage
      - --service
      - "{{ ocpp_csms_service_name }}"
      - --storage-root
      - "{{ ocpp_csms_data_dir }}"
  register: ocpp_csms_mcp_live
  changed_when: false

- name: Require provider to match active writer storage
  ansible.builtin.assert:
    that:
      - (ocpp_csms_mcp_live.stdout | from_json).active == ocpp_csms_service_data_dir
      - ocpp_csms_service_user == ansible_user_id

- name: Verify provider data and socket access without issuing commands
  ansible.builtin.command:
    argv:
      - "{{ ocpp_csms_release_venv }}/bin/python"
      - -m
      - ocpp_csms.mcp_manifest
      - probe
      - --data-dir
      - "{{ ocpp_csms_service_data_dir }}"
      - --mode
      - "{{ 'execute' if ocpp_csms_mcp_execute | bool else 'read' }}"
  changed_when: false

- name: Create protected GWay provider registry if absent
  become: true
  ansible.builtin.file:
    path: "{{ ocpp_csms_mcp_manifest_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: not (ocpp_csms_mcp_registry.stat.exists | default(false))

- name: Publish CSMS manifest atomically
  become: true
  ansible.builtin.copy:
    content: "{{ ocpp_csms_mcp_candidate.stdout }}\n"
    dest: "{{ ocpp_csms_mcp_manifest_path }}"
    owner: root
    group: root
    mode: "0644"
    unsafe_writes: false
