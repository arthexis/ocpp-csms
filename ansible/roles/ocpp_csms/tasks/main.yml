---
- name: Validate supported OCPP CSMS appliance host
  ansible.builtin.assert:
    that:
      - ansible_user_id != 'root'
      - ansible_user_uid | int != 0
      - ansible_facts.os_family == 'Debian'
      - ansible_facts.architecture in ['aarch64', 'arm64']
      - ocpp_csms_host | length > 0
      - ocpp_csms_port | int >= 1
      - ocpp_csms_port | int <= 65535
    fail_msg: >-
      OCPP CSMS installation must run as a non-root deployment user on a
      Debian-family ARM64 host with a valid listener host/port configuration.
      Use Ansible become for privileged host changes instead of running the
      playbook itself as root.

- name: Resolve release revision from controller checkout
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ ocpp_csms_controller_source_dir }}"
      - rev-parse
      - --short=12
      - HEAD
  delegate_to: localhost
  register: ocpp_csms_release_revision
  changed_when: false

- name: Capture immutable release identifier
  ansible.builtin.set_fact:
    ocpp_csms_release_id: "{{ ocpp_csms_release_revision.stdout }}"

# The first safety gate must run before appliance mutation. Idle connected
# chargers are expected; only active charging or unsafe persistence state blocks.
- name: Run local initial install safety preflight
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - ocpp_csms.install_preflight
      - --data-dir
      - "{{ ocpp_csms_data_dir }}"
      - --json
  environment:
    PYTHONPATH: "{{ ocpp_csms_controller_source_dir }}/src"
  changed_when: false
  when: (ansible_connection | default('ssh')) == 'local'

# A remote target cannot read the controller checkout. Copy the Python source
# only to a temporary directory, run the same read-only preflight, and always
# remove the temporary directory before any appliance staging begins.
- name: Run remote initial install safety preflight
  when: (ansible_connection | default('ssh')) != 'local'
  block:
    - name: Create temporary remote preflight source directory
      ansible.builtin.tempfile:
        state: directory
        suffix: -ocpp-csms-preflight
      register: ocpp_csms_remote_preflight_dir

    - name: Copy Python source for remote initial preflight
      ansible.builtin.copy:
        src: "{{ ocpp_csms_controller_source_dir }}/src/"
        dest: "{{ ocpp_csms_remote_preflight_dir.path }}/src/"
        mode: preserve

    - name: Execute remote initial install safety preflight
      ansible.builtin.command:
        argv:
          - python3
          - -m
          - ocpp_csms.install_preflight
          - --data-dir
          - "{{ ocpp_csms_data_dir }}"
          - --json
      environment:
        PYTHONPATH: "{{ ocpp_csms_remote_preflight_dir.path }}/src"
      changed_when: false
  always:
    - name: Remove temporary remote preflight source
      ansible.builtin.file:
        path: "{{ ocpp_csms_remote_preflight_dir.path }}"
        state: absent
      when: ocpp_csms_remote_preflight_dir.path is defined

- name: Install Python prerequisites
  become: true
  ansible.builtin.apt:
    name:
      - python3
      - python3-venv
      - python3-pip
    state: present
    update_cache: true

- name: Create OCPP CSMS base directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ ocpp_csms_prefix }}"
    - "{{ ocpp_csms_data_dir }}"
    - "{{ ocpp_csms_releases_dir }}"

- name: Check whether immutable release is already complete
  ansible.builtin.stat:
    path: "{{ ocpp_csms_release_dir }}/.ready"
  register: ocpp_csms_release_ready

- name: Create immutable release directory
  ansible.builtin.file:
    path: "{{ ocpp_csms_release_dir }}"
    state: directory
    mode: "0755"
  when: not ocpp_csms_release_ready.stat.exists

- name: Create release Python virtual environment
  ansible.builtin.command:
    cmd: "python3 -m venv {{ ocpp_csms_release_venv }}"
    creates: "{{ ocpp_csms_release_venv }}/bin/python"
  when: not ocpp_csms_release_ready.stat.exists

- name: Ensure current pip in release virtual environment
  ansible.builtin.pip:
    name: pip
    state: latest
    virtualenv: "{{ ocpp_csms_release_venv }}"
  when: not ocpp_csms_release_ready.stat.exists

# With a local connection the controller and managed host are the same Pi, so
# the checkout containing the playbook is already a valid target-side source.
- name: Use current checkout as install source for local execution
  ansible.builtin.set_fact:
    ocpp_csms_install_source: "{{ ocpp_csms_controller_source_dir }}"
  when:
    - not ocpp_csms_release_ready.stat.exists
    - (ansible_connection | default('ssh')) == 'local'

# Remote execution cannot install from a controller-side path. Stage only the
# inputs needed to build/install the Python package inside the immutable release.
- name: Create remote release source directory
  ansible.builtin.file:
    path: "{{ ocpp_csms_release_source_dir }}"
    state: directory
    mode: "0755"
  when:
    - not ocpp_csms_release_ready.stat.exists
    - (ansible_connection | default('ssh')) != 'local'

- name: Copy remote package metadata
  ansible.builtin.copy:
    src: "{{ ocpp_csms_controller_source_dir }}/{{ item }}"
    dest: "{{ ocpp_csms_release_source_dir }}/{{ item }}"
    mode: "0644"
  loop:
    - pyproject.toml
    - README.md
  when:
    - not ocpp_csms_release_ready.stat.exists
    - (ansible_connection | default('ssh')) != 'local'

- name: Copy remote Python package source
  ansible.builtin.copy:
    src: "{{ ocpp_csms_controller_source_dir }}/src/"
    dest: "{{ ocpp_csms_release_source_dir }}/src/"
    mode: preserve
  when:
    - not ocpp_csms_release_ready.stat.exists
    - (ansible_connection | default('ssh')) != 'local'

- name: Use release source as install source for remote execution
  ansible.builtin.set_fact:
    ocpp_csms_install_source: "{{ ocpp_csms_release_source_dir }}"
  when:
    - not ocpp_csms_release_ready.stat.exists
    - (ansible_connection | default('ssh')) != 'local'

- name: Install OCPP CSMS into immutable release
  ansible.builtin.pip:
    name: "{{ ocpp_csms_install_source }}"
    virtualenv: "{{ ocpp_csms_release_venv }}"
  when: not ocpp_csms_release_ready.stat.exists

- name: Verify immutable release command
  ansible.builtin.command:
    cmd: "{{ ocpp_csms_release_venv }}/bin/ocpp-csms --help"
  changed_when: false
  when: not ocpp_csms_release_ready.stat.exists

- name: Mark immutable release ready
  ansible.builtin.copy:
    dest: "{{ ocpp_csms_release_dir }}/.ready"
    content: "{{ ocpp_csms_release_id }}\n"
    mode: "0644"
  when: not ocpp_csms_release_ready.stat.exists

- name: Resolve OCPP CSMS service group
  ansible.builtin.command:
    cmd: id -gn
  register: ocpp_csms_service_group_result
  changed_when: false

- name: Resolve OCPP CSMS service identity
  ansible.builtin.set_fact:
    ocpp_csms_service_user: "{{ ansible_user_id }}"
    ocpp_csms_service_group: "{{ ocpp_csms_service_group_result.stdout }}"
    ocpp_csms_service_home: "{{ ansible_env.HOME }}"

- name: Render candidate OCPP CSMS systemd unit
  ansible.builtin.template:
    src: ocpp-csms.service.j2
    dest: "{{ ocpp_csms_candidate_service_path }}"
    mode: "0644"

# An existing appliance already has a valid `current` command path, so verify
# the replacement unit before the final safety gate and before any downtime.
- name: Inspect active OCPP CSMS runtime command
  ansible.builtin.stat:
    path: "{{ ocpp_csms_runtime_command }}"
  register: ocpp_csms_runtime_command_state

- name: Verify candidate systemd unit before handoff
  ansible.builtin.command:
    argv:
      - systemd-analyze
      - verify
      - "{{ ocpp_csms_candidate_service_path }}"
  changed_when: false
  when: ocpp_csms_runtime_command_state.stat.exists | default(false)

# Charging state can change while the candidate environment is being built, so
# repeat the Python-owned safety check immediately after staging is complete.
- name: Run final install safety preflight
  ansible.builtin.command:
    argv:
      - "{{ ocpp_csms_release_venv }}/bin/python"
      - -m
      - ocpp_csms.install_preflight
      - --data-dir
      - "{{ ocpp_csms_data_dir }}"
      - --json
  register: ocpp_csms_final_preflight
  changed_when: false

- name: Capture final preflight state
  ansible.builtin.set_fact:
    ocpp_csms_final_preflight_result: "{{ ocpp_csms_final_preflight.stdout | from_json }}"

- name: Inspect database schema cutover action
  ansible.builtin.command:
    argv:
      - "{{ ocpp_csms_release_venv }}/bin/python"
      - -m
      - ocpp_csms.install_cutover
      - schema-check
      - --data-dir
      - "{{ ocpp_csms_data_dir }}"
  register: ocpp_csms_schema_check
  changed_when: false

- name: Validate schema cutover action
  ansible.builtin.assert:
    that:
      - ocpp_csms_schema_check.stdout in ['create', 'current', 'upgrade']
    fail_msg: "Unexpected schema cutover action: {{ ocpp_csms_schema_check.stdout }}"

- name: Capture schema cutover action
  ansible.builtin.set_fact:
    ocpp_csms_schema_action: "{{ ocpp_csms_schema_check.stdout }}"

- name: Perform controlled OCPP CSMS handoff
  ansible.builtin.include_tasks: cutover.yml

# Expose only the canonical command name. The link follows `current`, so release
# promotion does not require rewriting the public command path.
- name: Install stable OCPP CSMS command
  become: true
  ansible.builtin.file:
    src: "{{ ocpp_csms_runtime_command }}"
    dest: "{{ ocpp_csms_command_path }}"
    state: link
    force: true

- name: Inspect stable OCPP CSMS command
  ansible.builtin.stat:
    path: "{{ ocpp_csms_command_path }}"
    follow: false
  register: ocpp_csms_command_state

- name: Assert stable OCPP CSMS command target
  ansible.builtin.assert:
    that:
      - ocpp_csms_command_state.stat.islnk | default(false)
      - ocpp_csms_command_state.stat.lnk_source == ocpp_csms_runtime_command
    fail_msg: >-
      Stable OCPP CSMS command does not point at the active current release.
