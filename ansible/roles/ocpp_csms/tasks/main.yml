---
- name: Validate supported OCPP CSMS appliance host
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == 'Debian'
      - ansible_facts.architecture in ['aarch64', 'arm64']
      - ocpp_csms_host | length > 0
      - ocpp_csms_port | int >= 1
      - ocpp_csms_port | int <= 65535
    fail_msg: >-
      OCPP CSMS installation requires a Debian-family ARM64 host and a valid
      listener host/port configuration.

- name: Install Python prerequisites
  become: true
  ansible.builtin.apt:
    name:
      - python3
      - python3-venv
      - python3-pip
    state: present
    update_cache: true

- name: Create OCPP CSMS directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ ocpp_csms_prefix }}"
    - "{{ ocpp_csms_bin_dir }}"
    - "{{ ocpp_csms_data_dir }}"

- name: Create staged Python virtual environment
  ansible.builtin.command:
    cmd: "python3 -m venv {{ ocpp_csms_stage_venv }}"
    creates: "{{ ocpp_csms_stage_venv }}/bin/python"

- name: Ensure current pip in staged virtual environment
  ansible.builtin.pip:
    name: pip
    state: latest
    virtualenv: "{{ ocpp_csms_stage_venv }}"

# With a local connection the controller and managed host are the same Pi, so
# the checkout containing the playbook is already a valid target-side source.
- name: Use current checkout as install source for local execution
  ansible.builtin.set_fact:
    ocpp_csms_install_source: "{{ ocpp_csms_controller_source_dir }}"
  when: (ansible_connection | default('ssh')) == 'local'

# Remote execution cannot install from a controller-side path. Stage only the
# inputs needed to build/install the Python package; do not create a second Git
# checkout on the managed host.
- name: Create remote staged source directory
  ansible.builtin.file:
    path: "{{ ocpp_csms_stage_source_dir }}"
    state: directory
    mode: "0755"
  when: (ansible_connection | default('ssh')) != 'local'

- name: Copy remote package metadata
  ansible.builtin.copy:
    src: "{{ ocpp_csms_controller_source_dir }}/{{ item }}"
    dest: "{{ ocpp_csms_stage_source_dir }}/{{ item }}"
    mode: "0644"
  loop:
    - pyproject.toml
    - README.md
  when: (ansible_connection | default('ssh')) != 'local'

- name: Copy remote Python package source
  ansible.builtin.copy:
    src: "{{ ocpp_csms_controller_source_dir }}/src/"
    dest: "{{ ocpp_csms_stage_source_dir }}/src/"
    mode: preserve
  when: (ansible_connection | default('ssh')) != 'local'

- name: Use staged source as install source for remote execution
  ansible.builtin.set_fact:
    ocpp_csms_install_source: "{{ ocpp_csms_stage_source_dir }}"
  when: (ansible_connection | default('ssh')) != 'local'

- name: Install OCPP CSMS into staged virtual environment
  ansible.builtin.pip:
    name: "{{ ocpp_csms_install_source }}"
    virtualenv: "{{ ocpp_csms_stage_venv }}"

- name: Verify staged OCPP CSMS command
  ansible.builtin.command:
    cmd: "{{ ocpp_csms_stage_venv }}/bin/ocpp-csms --help"
  changed_when: false

- name: Resolve OCPP CSMS service group
  ansible.builtin.command:
    cmd: id -gn
  register: ocpp_csms_service_group_result
  changed_when: false

- name: Resolve OCPP CSMS service identity
  ansible.builtin.set_fact:
    ocpp_csms_service_user: "{{ ansible_user_id }}"
    ocpp_csms_service_group: "{{ ocpp_csms_service_group_result.stdout }}"
    ocpp_csms_service_home: "{{ ansible_env.HOME }}"

- name: Render candidate OCPP CSMS systemd unit
  ansible.builtin.template:
    src: ocpp-csms.service.j2
    dest: "{{ ocpp_csms_candidate_service_path }}"
    mode: "0644"
