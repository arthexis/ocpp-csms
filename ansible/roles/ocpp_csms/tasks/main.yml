---
- name: Validate supported OCPP CSMS appliance host
  ansible.builtin.assert:
    that:
      - ansible_user_id != 'root'
      - ansible_user_uid | int != 0
      - ansible_facts.os_family == 'Debian'
      - ansible_facts.architecture in ['aarch64', 'arm64']
      - ocpp_csms_host | length > 0
      - ocpp_csms_port | int >= 1
      - ocpp_csms_port | int <= 65535
    fail_msg: >-
      OCPP CSMS installation must run as a non-root deployment user on a
      Debian-family ARM64 host with a valid listener host/port configuration.
      Use Ansible become for privileged host changes instead of running the
      playbook itself as root.

- name: Validate OCPP CSMS install mode
  ansible.builtin.assert:
    that:
      - ocpp_csms_install_mode in ['online', 'bundle']
      - ocpp_csms_install_mode != 'bundle' or ocpp_csms_bundle_path | length > 0
      - ocpp_csms_install_mode != 'bundle' or (ansible_connection | default('ssh')) == 'local'
      - ocpp_csms_install_mode != 'bundle' or not (ocpp_csms_dev | bool)
    fail_msg: >-
      Bundle installs require a local appliance connection, a bundle path,
      and production dependencies only.

- name: Resolve release revision from controller checkout
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ ocpp_csms_controller_source_dir }}"
      - rev-parse
      - --short=12
      - HEAD
  delegate_to: localhost
  register: ocpp_csms_release_revision
  changed_when: false
  when: ocpp_csms_install_mode == 'online'

- name: Read offline release manifest
  ansible.builtin.include_vars:
    file: "{{ ocpp_csms_bundle_manifest_path }}"
    name: ocpp_csms_bundle_manifest
  when: ocpp_csms_install_mode == 'bundle'

- name: Validate offline release manifest
  ansible.builtin.assert:
    that:
      - ocpp_csms_bundle_manifest.release | length > 0
      - ocpp_csms_bundle_manifest.architecture == ansible_facts.architecture
      - ocpp_csms_bundle_manifest.python == ansible_facts.python.version.major ~ '.' ~ ansible_facts.python.version.minor
    fail_msg: >-
      Offline release bundle metadata does not match this appliance.
  when: ocpp_csms_install_mode == 'bundle'

- name: Capture immutable release identifier
  ansible.builtin.set_fact:
    ocpp_csms_release_id: >-
      {{
        (ocpp_csms_bundle_manifest.release
         if ocpp_csms_install_mode == 'bundle'
         else ocpp_csms_release_revision.stdout)
        ~ ('-dev' if ocpp_csms_dev | bool else '')
      }}

- name: Select release source for preflight
  ansible.builtin.set_fact:
    ocpp_csms_preflight_source_dir: >-
      {{
        ocpp_csms_bundle_source_dir
        if ocpp_csms_install_mode == 'bundle'
        else ocpp_csms_controller_source_dir
      }}

# The first safety gate must run before appliance mutation. Idle connected
# chargers are expected; only active charging or unsafe persistence state blocks.
- name: Run local initial install safety preflight
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - ocpp_csms.install_preflight
      - --data-dir
      - "{{ ocpp_csms_data_dir }}"
      - --json
  environment:
    PYTHONPATH: "{{ ocpp_csms_preflight_source_dir }}/src"
  changed_when: false
  when: (ansible_connection | default('ssh')) == 'local'

# A remote target cannot read the controller checkout. Copy the Python source
# only to a temporary directory, run the same read-only preflight, and always
# remove the temporary directory before any appliance staging begins.
- name: Run remote initial install safety preflight
  when: (ansible_connection | default('ssh')) != 'local'
  block:
    - name: Create temporary remote preflight source directory
      ansible.builtin.tempfile:
        state: directory
        suffix: -ocpp-csms-preflight
      register: ocpp_csms_remote_preflight_dir

    - name: Copy Python source for remote initial preflight
      ansible.builtin.copy:
        src: "{{ ocpp_csms_preflight_source_dir }}/src/"
        dest: "{{ ocpp_csms_remote_preflight_dir.path }}/src/"
        mode: preserve

    - name: Execute remote initial install safety preflight
      ansible.builtin.command:
        argv:
          - python3
          - -m
          - ocpp_csms.install_preflight
          - --data-dir
          - "{{ ocpp_csms_data_dir }}"
          - --json
      environment:
        PYTHONPATH: "{{ ocpp_csms_remote_preflight_dir.path }}/src"
      changed_when: false
  always:
    - name: Remove temporary remote preflight source
      ansible.builtin.file:
        path: "{{ ocpp_csms_remote_preflight_dir.path }}"
        state: absent
      when: ocpp_csms_remote_preflight_dir.path is defined

- name: Install Python prerequisites
  become: true
  ansible.builtin.apt:
    name:
      - python3
      - python3-venv
      - python3-pip
      - iproute2
      - tcpdump
    state: present
    update_cache: true
  when: ocpp_csms_install_mode == 'online'

- name: Create OCPP CSMS base directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ ocpp_csms_prefix }}"
    - "{{ ocpp_csms_data_dir }}"
    - "{{ ocpp_csms_releases_dir }}"
    - "{{ ocpp_csms_builds_dir }}"
    - "{{ ocpp_csms_dependencies_dir }}"
    - "{{ ocpp_csms_candidate_dir }}"

- name: Check whether immutable release is already complete
  ansible.builtin.stat:
    path: "{{ ocpp_csms_release_dir }}/.ready"
  register: ocpp_csms_release_ready

- name: Create immutable release directory
  ansible.builtin.file:
    path: "{{ ocpp_csms_release_dir }}"
    state: directory
    mode: "0755"
  when: not ocpp_csms_release_ready.stat.exists

- name: Create release Python virtual environment
  ansible.builtin.command:
    cmd: "python3 -m venv {{ ocpp_csms_release_venv }}"
    creates: "{{ ocpp_csms_release_venv }}/bin/python"
  when: not ocpp_csms_release_ready.stat.exists

- name: Use current checkout as install source for local execution
  ansible.builtin.set_fact:
    ocpp_csms_install_source: "{{ ocpp_csms_controller_source_dir }}"
  when:
    - not ocpp_csms_release_ready.stat.exists
    - (ansible_connection | default('ssh')) == 'local'
    - ocpp_csms_install_mode == 'online'

- name: Create remote release source directory
  ansible.builtin.file:
    path: "{{ ocpp_csms_release_source_dir }}"
    state: directory
    mode: "0755"
  when:
    - not ocpp_csms_release_ready.stat.exists
    - (ansible_connection | default('ssh')) != 'local'
    - ocpp_csms_install_mode == 'online'

- name: Copy remote package metadata
  ansible.builtin.copy:
    src: "{{ ocpp_csms_controller_source_dir }}/{{ item }}"
    dest: "{{ ocpp_csms_release_source_dir }}/{{ item }}"
    mode: "0644"
  loop:
    - pyproject.toml
    - README.md
  when:
    - not ocpp_csms_release_ready.stat.exists
    - (ansible_connection | default('ssh')) != 'local'
    - ocpp_csms_install_mode == 'online'

- name: Copy remote Python package source
  ansible.builtin.copy:
    src: "{{ ocpp_csms_controller_source_dir }}/src/"
    dest: "{{ ocpp_csms_release_source_dir }}/src/"
    mode: preserve
  when:
    - not ocpp_csms_release_ready.stat.exists
    - (ansible_connection | default('ssh')) != 'local'
    - ocpp_csms_install_mode == 'online'

- name: Use release source as install source for remote execution
  ansible.builtin.set_fact:
    ocpp_csms_install_source: "{{ ocpp_csms_release_source_dir }}"
  when:
    - not ocpp_csms_release_ready.stat.exists
    - (ansible_connection | default('ssh')) != 'local'
    - ocpp_csms_install_mode == 'online'

- name: Find bundled OCPP CSMS application wheel
  ansible.builtin.find:
    paths: "{{ ocpp_csms_bundle_wheels_dir }}"
    patterns: "ocpp_csms-*.whl"
    file_type: file
  register: ocpp_csms_bundle_application_wheels
  when:
    - not ocpp_csms_release_ready.stat.exists
    - ocpp_csms_install_mode == 'bundle'

- name: Validate bundled OCPP CSMS application wheel
  ansible.builtin.assert:
    that:
      - ocpp_csms_bundle_application_wheels.matched | int == 1
    fail_msg: >-
      Expected exactly one OCPP CSMS application wheel in the offline bundle.
  when:
    - not ocpp_csms_release_ready.stat.exists
    - ocpp_csms_install_mode == 'bundle'

- name: Install bundled runtime dependencies
  ansible.builtin.command:
    argv:
      - "{{ ocpp_csms_release_venv }}/bin/python"
      - -m
      - pip
      - install
      - --no-index
      - --find-links
      - "{{ ocpp_csms_bundle_wheels_dir }}"
      - "ocpp>=0.26,<1"
      - "websockets>=12,<14"
  changed_when: true
  when:
    - not ocpp_csms_release_ready.stat.exists
    - ocpp_csms_install_mode == 'bundle'

- name: Install bundled OCPP CSMS application
  ansible.builtin.pip:
    name: "{{ ocpp_csms_bundle_application_wheels.files[0].path }}"
    virtualenv: "{{ ocpp_csms_release_venv }}"
    extra_args: "--no-index --no-deps"
  when:
    - not ocpp_csms_release_ready.stat.exists
    - ocpp_csms_install_mode == 'bundle'

- name: Check reusable build environment
  ansible.builtin.stat:
    path: "{{ ocpp_csms_build_dir }}/.ready"
  register: ocpp_csms_build_ready
  when:
    - not ocpp_csms_release_ready.stat.exists
    - ocpp_csms_install_mode == 'online'

- name: Create reusable build environment directory
  ansible.builtin.file:
    path: "{{ ocpp_csms_build_dir }}"
    state: directory
    mode: "0755"
  when:
    - not ocpp_csms_release_ready.stat.exists
    - ocpp_csms_install_mode == 'online'
    - not ocpp_csms_build_ready.stat.exists

- name: Create reusable build virtual environment
  ansible.builtin.command:
    cmd: "python3 -m venv {{ ocpp_csms_build_venv }}"
    creates: "{{ ocpp_csms_build_venv }}/bin/python"
  when:
    - not ocpp_csms_release_ready.stat.exists
    - ocpp_csms_install_mode == 'online'
    - not ocpp_csms_build_ready.stat.exists

- name: Install reusable build requirements
  ansible.builtin.pip:
    name: "{{ ocpp_csms_build_requirements }}"
    virtualenv: "{{ ocpp_csms_build_venv }}"
  when:
    - not ocpp_csms_release_ready.stat.exists
    - ocpp_csms_install_mode == 'online'
    - not ocpp_csms_build_ready.stat.exists

- name: Mark reusable build environment ready
  ansible.builtin.copy:
    dest: "{{ ocpp_csms_build_dir }}/.ready"
    content: "{{ ocpp_csms_build_key }}\n"
    mode: "0644"
  when:
    - not ocpp_csms_release_ready.stat.exists
    - ocpp_csms_install_mode == 'online'
    - not ocpp_csms_build_ready.stat.exists

- name: Check reusable runtime dependency environment
  ansible.builtin.stat:
    path: "{{ ocpp_csms_dependency_dir }}/.ready"
  register: ocpp_csms_dependency_ready
  when:
    - not ocpp_csms_release_ready.stat.exists
    - ocpp_csms_install_mode == 'online'

- name: Create reusable runtime dependency directory
  ansible.builtin.file:
    path: "{{ ocpp_csms_dependency_dir }}"
    state: directory
    mode: "0755"
  when:
    - not ocpp_csms_release_ready.stat.exists
    - ocpp_csms_install_mode == 'online'
    - not ocpp_csms_dependency_ready.stat.exists

- name: Create reusable runtime dependency virtual environment
  ansible.builtin.command:
    cmd: "python3 -m venv {{ ocpp_csms_dependency_venv }}"
    creates: "{{ ocpp_csms_dependency_venv }}/bin/python"
  when:
    - not ocpp_csms_release_ready.stat.exists
    - ocpp_csms_install_mode == 'online'
    - not ocpp_csms_dependency_ready.stat.exists

- name: Install reusable WebSockets dependency
  ansible.builtin.pip:
    name: "websockets>=12,<14"
    virtualenv: "{{ ocpp_csms_dependency_venv }}"
  when:
    - not ocpp_csms_release_ready.stat.exists
    - ocpp_csms_install_mode == 'online'
    - not ocpp_csms_dependency_ready.stat.exists

- name: Install reusable OCPP dependency
  ansible.builtin.pip:
    name: "ocpp>=0.26,<1"
    virtualenv: "{{ ocpp_csms_dependency_venv }}"
  when:
    - not ocpp_csms_release_ready.stat.exists
    - ocpp_csms_install_mode == 'online'
    - not ocpp_csms_dependency_ready.stat.exists

- name: Mark reusable runtime dependency environment ready
  ansible.builtin.copy:
    dest: "{{ ocpp_csms_dependency_dir }}/.ready"
    content: "{{ ocpp_csms_dependency_key }}\n"
    mode: "0644"
  when:
    - not ocpp_csms_release_ready.stat.exists
    - ocpp_csms_install_mode == 'online'
    - not ocpp_csms_dependency_ready.stat.exists

- name: Resolve reusable runtime dependency site packages
  ansible.builtin.command:
    argv:
      - "{{ ocpp_csms_dependency_venv }}/bin/python"
      - -c
      - "import sysconfig; print(sysconfig.get_paths()['purelib'])"
  register: ocpp_csms_dependency_site_packages
  changed_when: false
  when:
    - not ocpp_csms_release_ready.stat.exists
    - ocpp_csms_install_mode == 'online'

- name: Resolve release site packages
  ansible.builtin.command:
    argv:
      - "{{ ocpp_csms_release_venv }}/bin/python"
      - -c
      - "import sysconfig; print(sysconfig.get_paths()['purelib'])"
  register: ocpp_csms_release_site_packages
  changed_when: false
  when:
    - not ocpp_csms_release_ready.stat.exists
    - ocpp_csms_install_mode == 'online'

- name: Link reusable runtime dependencies into release
  ansible.builtin.copy:
    dest: "{{ ocpp_csms_release_site_packages.stdout }}/ocpp_csms_dependencies.pth"
    content: "{{ ocpp_csms_dependency_site_packages.stdout }}\n"
    mode: "0644"
  when:
    - not ocpp_csms_release_ready.stat.exists
    - ocpp_csms_install_mode == 'online'

- name: Create release wheel directory
  ansible.builtin.file:
    path: "{{ ocpp_csms_release_wheels_dir }}"
    state: directory
    mode: "0755"
  when:
    - not ocpp_csms_release_ready.stat.exists
    - ocpp_csms_install_mode == 'online'

- name: Build OCPP CSMS application wheel
  ansible.builtin.command:
    argv:
      - "{{ ocpp_csms_build_venv }}/bin/python"
      - -m
      - pip
      - wheel
      - --no-deps
      - --no-build-isolation
      - --wheel-dir
      - "{{ ocpp_csms_release_wheels_dir }}"
      - "{{ ocpp_csms_install_source }}"
  changed_when: true
  when:
    - not ocpp_csms_release_ready.stat.exists
    - ocpp_csms_install_mode == 'online'

- name: Find built OCPP CSMS application wheel
  ansible.builtin.find:
    paths: "{{ ocpp_csms_release_wheels_dir }}"
    patterns: "ocpp_csms-*.whl"
    file_type: file
  register: ocpp_csms_built_application_wheels
  when:
    - not ocpp_csms_release_ready.stat.exists
    - ocpp_csms_install_mode == 'online'

- name: Validate built OCPP CSMS application wheel
  ansible.builtin.assert:
    that:
      - ocpp_csms_built_application_wheels.matched | int == 1
    fail_msg: >-
      Expected exactly one built OCPP CSMS application wheel for the release.
  when:
    - not ocpp_csms_release_ready.stat.exists
    - ocpp_csms_install_mode == 'online'

- name: Install release development dependencies
  ansible.builtin.pip:
    name:
      - "pytest>=8,<9"
      - "pytest-asyncio>=0.23,<2"
      - "pytest-xdist>=3,<4"
    virtualenv: "{{ ocpp_csms_release_venv }}"
  when:
    - not ocpp_csms_release_ready.stat.exists
    - ocpp_csms_install_mode == 'online'
    - ocpp_csms_dev | bool

- name: Install OCPP CSMS application wheel into immutable release
  ansible.builtin.pip:
    name: "{{ ocpp_csms_built_application_wheels.files[0].path }}"
    virtualenv: "{{ ocpp_csms_release_venv }}"
    extra_args: "--no-index --no-deps"
  when:
    - not ocpp_csms_release_ready.stat.exists
    - ocpp_csms_install_mode == 'online'

- name: Verify immutable release command
  ansible.builtin.command:
    cmd: "{{ ocpp_csms_release_command }} --help"
  changed_when: false
  when: not ocpp_csms_release_ready.stat.exists

- name: Mark immutable release ready
  ansible.builtin.copy:
    dest: "{{ ocpp_csms_release_dir }}/.ready"
    content: "{{ ocpp_csms_release_id }}\n"
    mode: "0644"
  when: not ocpp_csms_release_ready.stat.exists

- name: Resolve OCPP CSMS service group
  ansible.builtin.command:
    cmd: id -gn
  register: ocpp_csms_service_group_result
  changed_when: false

- name: Resolve OCPP CSMS service identity
  ansible.builtin.set_fact:
    ocpp_csms_service_user: "{{ ansible_user_id }}"
    ocpp_csms_service_group: "{{ ocpp_csms_service_group_result.stdout }}"
    ocpp_csms_service_home: "{{ ansible_env.HOME }}"

# TLS state belongs to the appliance, never an immutable release. Create only
# its directories; in particular do not create/overwrite tls.json or keys.
- name: Prepare persistent OCPP CSMS TLS directories
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ ocpp_csms_service_user }}"
    group: "{{ ocpp_csms_service_group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "/etc/ocpp-csms", mode: "0750" }
    - { path: "/etc/ocpp-csms/tls", mode: "0700" }

# Repair the common upgrade case where an operator previously ran
# 'sudo ocpp-csms tls config' and left tls.json root-owned and unreadable.
# Preserve the file bytes and its enabled state.
- name: Inspect existing TLS configuration ownership
  become: true
  ansible.builtin.stat:
    path: /etc/ocpp-csms/tls.json
    follow: false
  register: ocpp_csms_tls_config_stat

- name: Preserve TLS configuration under the CSMS service identity
  become: true
  ansible.builtin.file:
    path: /etc/ocpp-csms/tls.json
    state: file
    owner: "{{ ocpp_csms_service_user }}"
    group: "{{ ocpp_csms_service_group }}"
    mode: "0600"
    follow: false
  when:
    - ocpp_csms_tls_config_stat.stat.exists | default(false)
    - ocpp_csms_tls_config_stat.stat.isreg | default(false)

- name: Reject unsafe non-regular TLS configuration
  ansible.builtin.assert:
    that:
      - not (ocpp_csms_tls_config_stat.stat.exists | default(false)) or
        (ocpp_csms_tls_config_stat.stat.isreg | default(false))
    fail_msg: TLS configuration must be a regular file, not a symbolic link or directory.

# TLS readiness must be measured as the same non-root UID as the service.
# This check intentionally cannot mutate the config or certificates.
- name: Check deployed TLS readiness as service account
  ansible.builtin.command:
    argv:
      - "{{ ocpp_csms_release_command }}"
      - tls
      - check
      - --ws-port
      - "{{ ocpp_csms_port }}"
  register: ocpp_csms_tls_readiness
  changed_when: false
  failed_when: false
  when: ocpp_csms_tls_config_stat.stat.exists | default(false)

- name: Read TLS configuration enablement without modifying state
  ansible.builtin.command:
    argv:
      - "{{ ocpp_csms_release_venv }}/bin/python"
      - -c
      - "import json; from pathlib import Path; p=Path('/etc/ocpp-csms/tls.json'); print('enabled' if json.loads(p.read_text()).get('enabled') is True else 'disabled')"
  register: ocpp_csms_tls_enablement
  changed_when: false
  when: ocpp_csms_tls_config_stat.stat.exists | default(false)

- name: Block deployment with enabled but unusable WSS credentials
  ansible.builtin.assert:
    that:
      - ocpp_csms_tls_readiness.rc == 0
    fail_msg: >-
      TLS is enabled but the service account cannot validate its certificate,
      private key, hostname or listener port. Preserve WS service and repair
      TLS credentials before deploying.
  when:
    - ocpp_csms_tls_config_stat.stat.exists | default(false)
    - ocpp_csms_tls_enablement.stdout == 'enabled'

- name: Render candidate OCPP CSMS systemd unit
  ansible.builtin.template:
    src: ocpp-csms.service.j2
    dest: "{{ ocpp_csms_candidate_service_path }}"
    mode: "0644"

- name: Verify candidate systemd unit before handoff
  ansible.builtin.command:
    argv:
      - systemd-analyze
      - verify
      - "{{ ocpp_csms_candidate_service_path }}"
  changed_when: false

- name: Run final install safety preflight
  ansible.builtin.command:
    argv:
      - "{{ ocpp_csms_release_venv }}/bin/python"
      - -m
      - ocpp_csms.install_preflight
      - --data-dir
      - "{{ ocpp_csms_data_dir }}"
      - --json
  register: ocpp_csms_final_preflight
  changed_when: false

- name: Capture final preflight state
  ansible.builtin.set_fact:
    ocpp_csms_final_preflight_result: "{{ ocpp_csms_final_preflight.stdout | from_json }}"

# Identify an incumbent only from observed host-local OCPP traffic. Product
# names and historical ports are intentionally irrelevant; the observed port is
# resolved to its owning PID and systemd service before any downtime begins.
- name: Inspect incumbent host-local OCPP service
  ansible.builtin.include_tasks: incumbent.yml

- name: Inspect database schema cutover action
  ansible.builtin.command:
    argv:
      - "{{ ocpp_csms_release_venv }}/bin/python"
      - -m
      - ocpp_csms.install_cutover
      - schema-check
      - --data-dir
      - "{{ ocpp_csms_data_dir }}"
  register: ocpp_csms_schema_check
  changed_when: false

- name: Validate schema cutover action
  ansible.builtin.assert:
    that:
      - ocpp_csms_schema_check.stdout in ['create', 'current', 'upgrade']
    fail_msg: "Unexpected schema cutover action: {{ ocpp_csms_schema_check.stdout }}"

- name: Capture schema cutover action
  ansible.builtin.set_fact:
    ocpp_csms_schema_action: "{{ ocpp_csms_schema_check.stdout }}"

- name: Report staged OCPP CSMS handoff plan
  ansible.builtin.debug:
    msg:
      release: "{{ ocpp_csms_release_id }}"
      incumbent_service: "{{ ocpp_csms_incumbent_service | default('') }}"
      incumbent_port: "{{ ocpp_csms_incumbent_port | default(0) }}"
      schema_action: "{{ ocpp_csms_schema_action }}"
      preflight: "{{ ocpp_csms_final_preflight_result }}"
      handoff: skipped
  when: ocpp_csms_stage_only | bool

- name: End host after safe staging
  ansible.builtin.meta: end_host
  when: ocpp_csms_stage_only | bool

- name: Perform controlled OCPP CSMS handoff
  ansible.builtin.include_tasks: cutover.yml

- name: Install stable OCPP CSMS command
  become: true
  ansible.builtin.file:
    src: "{{ ocpp_csms_runtime_command }}"
    dest: "{{ ocpp_csms_command_path }}"
    state: link
    force: true

- name: Resolve stable OCPP CSMS command target
  ansible.builtin.command:
    argv:
      - readlink
      - -f
      - "{{ ocpp_csms_command_path }}"
  register: ocpp_csms_command_resolved
  changed_when: false

- name: Resolve active OCPP CSMS release command
  ansible.builtin.command:
    argv:
      - readlink
      - -f
      - "{{ ocpp_csms_release_command }}"
  register: ocpp_csms_release_command_resolved
  changed_when: false

- name: Assert stable OCPP CSMS command target
  ansible.builtin.assert:
    that:
      - ocpp_csms_command_resolved.stdout == ocpp_csms_release_command_resolved.stdout
    fail_msg: >-
      Stable OCPP CSMS command does not resolve to the active current release.
