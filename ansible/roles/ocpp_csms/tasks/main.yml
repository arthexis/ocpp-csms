---
- name: Validate supported OCPP CSMS appliance host
  ansible.builtin.assert:
    that:
      - ansible_user_id != 'root'
      - ansible_user_uid | int != 0
      - ansible_facts.os_family == 'Debian'
      - ansible_facts.architecture in ['aarch64', 'arm64', 'x86_64', 'amd64']
      - ocpp_csms_host | length > 0
      - ocpp_csms_port | int >= 1
      - ocpp_csms_port | int <= 65535
    fail_msg: >-
      OCPP CSMS installation must run as a non-root deployment user on a
      Debian-family ARM64 or x86_64 host with a valid listener host/port configuration.
      Use Ansible become for privileged host changes instead of running the
      playbook itself as root.

# Downgrade protection must run before package installation, directory creation,
# candidate preparation, or service handoff. The live unit's --data-dir is the
# authority; historical schemas on disk are not evidence of an active version.
- name: Reject schema downgrade before any deployment mutation
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import ast
        import re
        import subprocess
        import sys
        from pathlib import Path

        source = ast.parse(Path(sys.argv[1]).read_text())
        values = [
            ast.literal_eval(node.value)
            for node in source.body
            if isinstance(node, ast.Assign)
            and any(isinstance(target, ast.Name) and target.id == "CURRENT_SCHEMA_VERSION" for target in node.targets)
        ]
        if len(values) != 1 or type(values[0]) is not int or values[0] < 1:
            raise SystemExit("invalid candidate schema declaration")
        candidate = values[0]
        active = subprocess.run(
            ["systemctl", "is-active", "--quiet", "ocpp-csms.service"],
            check=False,
        ).returncode == 0
        if active:
            unit = subprocess.run(
                ["systemctl", "show", "ocpp-csms.service", "-p", "ExecStart", "--value"],
                check=True, capture_output=True, text=True,
            ).stdout
            versions = re.findall(r"/schemas/([0-9]+)(?=[/\s;}]|$)", unit)
            if len(versions) != 1:
                raise SystemExit("cannot determine active CSMS schema; refusing deployment")
            running = int(versions[0])
            if candidate < running:
                raise SystemExit(
                    f"schema downgrade rejected: running {running}, candidate {candidate}"
                )
        print(f"schema downgrade preflight accepted: candidate {candidate}")
      - "{{ ocpp_csms_controller_source_dir }}/src/ocpp_csms/schema.py"
  changed_when: false

- name: Resolve release revision from controller checkout
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ ocpp_csms_controller_source_dir }}"
      - rev-parse
      - --short=12
      - HEAD
  delegate_to: localhost
  register: ocpp_csms_release_revision
  changed_when: false

- name: Capture immutable release identifier
  ansible.builtin.set_fact:
    ocpp_csms_release_id: "{{ ocpp_csms_release_revision.stdout ~ ('-dev' if ocpp_csms_dev | bool else '') }}"

- name: Install Python prerequisites
  block:
    - name: Install required system packages
      become: true
      ansible.builtin.apt:
        name:
          - python3
          - python3-venv
          - python3-pip
          - iproute2
          - tcpdump
        state: present
        update_cache: true
        cache_valid_time: 3600
  rescue:
    - name: Explain administrator authentication failure
      ansible.builtin.fail:
        msg: >-
          Ansible could not obtain sudo privileges. Run 'sudo -v' to authenticate, then retry
          './deploy.sh'. Do not run deploy.sh as root.
          Original error: {{ ansible_failed_result.msg | default('unknown error') }}
      when: >-
        'sudo: a password is required' in (ansible_failed_result.msg | default('')) or
        'Missing sudo password' in (ansible_failed_result.msg | default(''))
    - name: Preserve other package-installation errors
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.msg | default('System package installation failed') }}"
      when: >-
        'sudo: a password is required' not in (ansible_failed_result.msg | default('')) and
        'Missing sudo password' not in (ansible_failed_result.msg | default(''))

- name: Create OCPP CSMS base directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ ocpp_csms_prefix }}"
    - "{{ ocpp_csms_data_dir }}"
    - "{{ ocpp_csms_releases_dir }}"
    - "{{ ocpp_csms_builds_dir }}"
    - "{{ ocpp_csms_dependencies_dir }}"
    - "{{ ocpp_csms_candidate_dir }}"

# Existing releases are immutable: validate actual files and imports, never markers.
- name: Inspect immutable release directory
  ansible.builtin.stat:
    path: "{{ ocpp_csms_release_dir }}"
    follow: false
  register: ocpp_csms_release_directory

- name: Verify existing release distribution and executable
  ansible.builtin.command:
    argv:
      - "{{ ocpp_csms_release_venv }}/bin/python"
      - -c
      - >-
        from importlib.metadata import distribution;
        from pathlib import Path;
        import ocpp_csms;
        d = distribution('ocpp-csms');
        assert d.version;
        assert Path('{{ ocpp_csms_release_command }}').is_file();
        assert Path(ocpp_csms.__file__).resolve().is_relative_to(Path('{{ ocpp_csms_release_venv }}').resolve())
  register: ocpp_csms_release_probe
  changed_when: false
  failed_when: false
  when: ocpp_csms_release_directory.stat.exists | default(false)

- name: Verify existing release command
  ansible.builtin.command:
    argv:
      - "{{ ocpp_csms_release_command }}"
      - --help
  register: ocpp_csms_release_command_probe
  changed_when: false
  failed_when: false
  when:
    - ocpp_csms_release_directory.stat.exists | default(false)
    - ocpp_csms_release_probe.rc | default(1) == 0

- name: Reject incomplete immutable release without modifying it
  ansible.builtin.assert:
    that:
      - ocpp_csms_release_directory.stat.isdir | default(false)
      - ocpp_csms_release_probe.rc | default(1) == 0
      - ocpp_csms_release_command_probe.rc | default(1) == 0
    fail_msg: >-
      Existing immutable release is incomplete or unusable; refusing
      to modify it in place. Inspect before retrying deployment.
  when: ocpp_csms_release_directory.stat.exists | default(false)

- name: Capture verified immutable release readiness
  ansible.builtin.set_fact:
    ocpp_csms_release_ready:
      stat:
        exists: "{{ ocpp_csms_release_directory.stat.exists | default(false) }}"

- name: Create immutable release directory
  ansible.builtin.file:
    path: "{{ ocpp_csms_release_dir }}"
    state: directory
    mode: "0755"
  when: not ocpp_csms_release_ready.stat.exists

- name: Create release Python virtual environment
  ansible.builtin.command:
    cmd: "python3 -m venv {{ ocpp_csms_release_venv }}"
    creates: "{{ ocpp_csms_release_venv }}/bin/python"
  when: not ocpp_csms_release_ready.stat.exists

- name: Use current checkout as install source for local execution
  ansible.builtin.set_fact:
    ocpp_csms_install_source: "{{ ocpp_csms_controller_source_dir }}"
  when:
    - not ocpp_csms_release_ready.stat.exists
    - (ansible_connection | default('ssh')) == 'local'

- name: Create remote release source directory
  ansible.builtin.file:
    path: "{{ ocpp_csms_release_source_dir }}"
    state: directory
    mode: "0755"
  when:
    - not ocpp_csms_release_ready.stat.exists
    - (ansible_connection | default('ssh')) != 'local'

- name: Copy remote package metadata
  ansible.builtin.copy:
    src: "{{ ocpp_csms_controller_source_dir }}/{{ item }}"
    dest: "{{ ocpp_csms_release_source_dir }}/{{ item }}"
    mode: "0644"
  loop:
    - pyproject.toml
    - README.md
  when:
    - not ocpp_csms_release_ready.stat.exists
    - (ansible_connection | default('ssh')) != 'local'

- name: Copy remote Python package source
  ansible.builtin.copy:
    src: "{{ ocpp_csms_controller_source_dir }}/src/"
    dest: "{{ ocpp_csms_release_source_dir }}/src/"
    mode: preserve
  when:
    - not ocpp_csms_release_ready.stat.exists
    - (ansible_connection | default('ssh')) != 'local'

- name: Use release source as install source for remote execution
  ansible.builtin.set_fact:
    ocpp_csms_install_source: "{{ ocpp_csms_release_source_dir }}"
  when:
    - not ocpp_csms_release_ready.stat.exists
    - (ansible_connection | default('ssh')) != 'local'

# Build tools are converged from the actual venv, not from a completion marker.
# A missing interpreter is repaired before pip reconciles required packages.
- name: Create reusable build environment directory
  ansible.builtin.file:
    path: "{{ ocpp_csms_build_dir }}"
    state: directory
    mode: "0755"
  when: not ocpp_csms_release_ready.stat.exists

- name: Create reusable build virtual environment
  ansible.builtin.command:
    cmd: "python3 -m venv {{ ocpp_csms_build_venv }}"
    creates: "{{ ocpp_csms_build_venv }}/bin/python"
  when: not ocpp_csms_release_ready.stat.exists

- name: Converge reusable build requirements
  ansible.builtin.pip:
    name: "{{ ocpp_csms_build_requirements }}"
    virtualenv: "{{ ocpp_csms_build_venv }}"
  when: not ocpp_csms_release_ready.stat.exists

- name: Verify reusable build environment can build wheels
  ansible.builtin.command:
    argv:
      - "{{ ocpp_csms_build_venv }}/bin/python"
      - -c
      - "from setuptools import build_meta; assert callable(build_meta.build_wheel)"
  changed_when: false
  when: not ocpp_csms_release_ready.stat.exists

# Runtime dependencies are checked against their actual installed distributions.
# The cache key still identifies the requested dependency set, but no marker
# file is trusted as evidence of successful installation.
- name: Create reusable runtime dependency directory
  ansible.builtin.file:
    path: "{{ ocpp_csms_dependency_dir }}"
    state: directory
    mode: "0755"
  when: not ocpp_csms_release_ready.stat.exists

- name: Create reusable runtime dependency virtual environment
  ansible.builtin.command:
    cmd: "python3 -m venv {{ ocpp_csms_dependency_venv }}"
    creates: "{{ ocpp_csms_dependency_venv }}/bin/python"
  when: not ocpp_csms_release_ready.stat.exists

- name: Converge reusable runtime dependencies
  ansible.builtin.pip:
    name: "{{ ocpp_csms_runtime_dependencies }}"
    virtualenv: "{{ ocpp_csms_dependency_venv }}"
  when: not ocpp_csms_release_ready.stat.exists

- name: Verify reusable runtime dependencies
  ansible.builtin.command:
    argv:
      - "{{ ocpp_csms_dependency_venv }}/bin/python"
      - -c
      - "import ocpp, websockets; from importlib.metadata import version; assert version('ocpp') and version('websockets')"
  changed_when: false
  when: not ocpp_csms_release_ready.stat.exists

- name: Resolve reusable runtime dependency site packages
  ansible.builtin.command:
    argv:
      - "{{ ocpp_csms_dependency_venv }}/bin/python"
      - -c
      - "import sysconfig; print(sysconfig.get_paths()['purelib'])"
  register: ocpp_csms_dependency_site_packages
  changed_when: false
  when:
    - not ocpp_csms_release_ready.stat.exists

- name: Resolve release site packages
  ansible.builtin.command:
    argv:
      - "{{ ocpp_csms_release_venv }}/bin/python"
      - -c
      - "import sysconfig; print(sysconfig.get_paths()['purelib'])"
  register: ocpp_csms_release_site_packages
  changed_when: false
  when:
    - not ocpp_csms_release_ready.stat.exists

- name: Link reusable runtime dependencies into release
  ansible.builtin.copy:
    dest: "{{ ocpp_csms_release_site_packages.stdout }}/ocpp_csms_dependencies.pth"
    content: "{{ ocpp_csms_dependency_site_packages.stdout }}\n"
    mode: "0644"
  when:
    - not ocpp_csms_release_ready.stat.exists

- name: Create release wheel directory
  ansible.builtin.file:
    path: "{{ ocpp_csms_release_wheels_dir }}"
    state: directory
    mode: "0755"
  when:
    - not ocpp_csms_release_ready.stat.exists

- name: Build OCPP CSMS application wheel
  ansible.builtin.command:
    argv:
      - "{{ ocpp_csms_build_venv }}/bin/python"
      - -m
      - pip
      - wheel
      - --no-deps
      - --no-build-isolation
      - --wheel-dir
      - "{{ ocpp_csms_release_wheels_dir }}"
      - "{{ ocpp_csms_install_source }}"
  changed_when: true
  when:
    - not ocpp_csms_release_ready.stat.exists

- name: Find built OCPP CSMS application wheel
  ansible.builtin.find:
    paths: "{{ ocpp_csms_release_wheels_dir }}"
    patterns: "ocpp_csms-*.whl"
    file_type: file
  register: ocpp_csms_built_application_wheels
  when:
    - not ocpp_csms_release_ready.stat.exists

- name: Validate built OCPP CSMS application wheel
  ansible.builtin.assert:
    that:
      - ocpp_csms_built_application_wheels.matched | int == 1
    fail_msg: >-
      Expected exactly one built OCPP CSMS application wheel for the release.
  when:
    - not ocpp_csms_release_ready.stat.exists

- name: Install release development dependencies
  ansible.builtin.pip:
    name:
      - "pytest>=8,<9"
      - "pytest-asyncio>=0.23,<2"
      - "pytest-xdist>=3,<4"
    virtualenv: "{{ ocpp_csms_release_venv }}"
  when:
    - not ocpp_csms_release_ready.stat.exists
    - ocpp_csms_dev | bool

- name: Install OCPP CSMS application wheel into immutable release
  ansible.builtin.pip:
    name: "{{ ocpp_csms_built_application_wheels.files[0].path }}"
    virtualenv: "{{ ocpp_csms_release_venv }}"
    extra_args: "--no-index --no-deps"
  when:
    - not ocpp_csms_release_ready.stat.exists

- name: Verify immutable release command
  ansible.builtin.command:
    cmd: "{{ ocpp_csms_release_command }} --help"
  changed_when: false
  when: not ocpp_csms_release_ready.stat.exists

- name: Resolve OCPP CSMS service group
  ansible.builtin.command:
    cmd: id -gn
  register: ocpp_csms_service_group_result
  changed_when: false

- name: Resolve OCPP CSMS service identity
  ansible.builtin.set_fact:
    ocpp_csms_service_user: "{{ ansible_user_id }}"
    ocpp_csms_service_group: "{{ ocpp_csms_service_group_result.stdout }}"
    ocpp_csms_service_home: "{{ ansible_env.HOME }}"

# TLS state belongs to the appliance, never an immutable release. Create only
# its directories; in particular do not create/overwrite tls.json or keys.
- name: Prepare persistent OCPP CSMS TLS directories
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ ocpp_csms_service_user }}"
    group: "{{ ocpp_csms_service_group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "/etc/ocpp-csms", mode: "0750" }
    - { path: "/etc/ocpp-csms/tls", mode: "0700" }

# Repair the common upgrade case where an operator previously ran
# 'sudo ocpp-csms tls config' and left tls.json root-owned and unreadable.
# Preserve the file bytes and its enabled state.
- name: Inspect existing TLS configuration ownership
  become: true
  ansible.builtin.stat:
    path: /etc/ocpp-csms/tls.json
    follow: false
  register: ocpp_csms_tls_config_stat

- name: Preserve TLS configuration under the CSMS service identity
  become: true
  ansible.builtin.file:
    path: /etc/ocpp-csms/tls.json
    state: file
    owner: "{{ ocpp_csms_service_user }}"
    group: "{{ ocpp_csms_service_group }}"
    mode: "0600"
    follow: false
  when:
    - ocpp_csms_tls_config_stat.stat.exists | default(false)
    - ocpp_csms_tls_config_stat.stat.isreg | default(false)

- name: Reject unsafe non-regular TLS configuration
  ansible.builtin.assert:
    that:
      - not (ocpp_csms_tls_config_stat.stat.exists | default(false)) or
        (ocpp_csms_tls_config_stat.stat.isreg | default(false))
    fail_msg: TLS configuration must be a regular file, not a symbolic link or directory.

# TLS readiness must be measured as the same non-root UID as the service.
# This check intentionally cannot mutate the config or certificates.
- name: Check deployed TLS readiness as service account
  ansible.builtin.command:
    argv:
      - "{{ ocpp_csms_release_command }}"
      - tls
      - check
      - --ws-port
      - "{{ ocpp_csms_port }}"
  register: ocpp_csms_tls_readiness
  changed_when: false
  failed_when: false
  when: ocpp_csms_tls_config_stat.stat.exists | default(false)

- name: Read TLS configuration enablement without modifying state
  ansible.builtin.command:
    argv:
      - "{{ ocpp_csms_release_venv }}/bin/python"
      - -c
      - >-
        import json;
        from pathlib import Path;
        config = json.loads(Path('/etc/ocpp-csms/tls.json').read_text());
        print('enabled' if config.get('enabled') is True else 'disabled')
  register: ocpp_csms_tls_enablement
  changed_when: false
  when: ocpp_csms_tls_config_stat.stat.exists | default(false)

- name: Block deployment with enabled but unusable WSS credentials
  ansible.builtin.assert:
    that:
      - ocpp_csms_tls_readiness.rc == 0
    fail_msg: >-
      TLS is enabled but the service account cannot validate its certificate,
      private key, hostname or listener port. Preserve WS service and repair
      TLS credentials before deploying.
  when:
    - ocpp_csms_tls_config_stat.stat.exists | default(false)
    - ocpp_csms_tls_enablement.stdout == 'enabled'

- name: Inspect versioned storage plan for staged handoff
  ansible.builtin.include_tasks: storage_plan.yml

- name: Select candidate service storage directory
  ansible.builtin.set_fact:
    ocpp_csms_service_data_dir: "{{ ocpp_csms_storage_selection.target }}"

- name: Render candidate OCPP CSMS systemd unit
  ansible.builtin.template:
    src: ocpp-csms.service.j2
    dest: "{{ ocpp_csms_candidate_service_path }}"
    mode: "0644"

- name: Verify candidate systemd unit before handoff
  ansible.builtin.command:
    argv:
      - systemd-analyze
      - verify
      - "{{ ocpp_csms_candidate_service_path }}"
  changed_when: false

# Prepare a fresh schema candidate only for a real handoff. Staging must
# never create storage; no database activation pointer exists.
- name: Prepare versioned candidate before service downtime
  ansible.builtin.include_tasks: storage_prepare.yml
  when:
    - not (ocpp_csms_stage_only | bool)
    - ocpp_csms_storage_selection.action == 'create'

- name: Report staged OCPP CSMS handoff plan
  ansible.builtin.debug:
    msg:
      release: "{{ ocpp_csms_release_id }}"
      schema_action: "{{ ocpp_csms_storage_selection.action }}"
      handoff: skipped
  when: ocpp_csms_stage_only | bool

- name: End host after safe staging
  ansible.builtin.meta: end_host
  when: ocpp_csms_stage_only | bool

# JSON archives are diagnostic projections alongside the selected schema database.
# Prepare their parent directory before cutover, without writing transaction data.
- name: Prepare selected schema transaction archive directory
  ansible.builtin.file:
    path: "{{ ocpp_csms_transactions_dir }}"
    state: directory
    owner: "{{ ocpp_csms_service_user }}"
    group: "{{ ocpp_csms_service_group }}"
    mode: "0750"

# Versioned cutover remains explicitly gated until recovery is verified.
- name: Perform controlled OCPP CSMS handoff
  ansible.builtin.include_tasks: cutover.yml

- name: Install stable OCPP CSMS command
  become: true
  ansible.builtin.file:
    src: "{{ ocpp_csms_runtime_command }}"
    dest: "{{ ocpp_csms_command_path }}"
    state: link
    force: true

- name: Resolve stable OCPP CSMS command target
  ansible.builtin.command:
    argv:
      - readlink
      - -f
      - "{{ ocpp_csms_command_path }}"
  register: ocpp_csms_command_resolved
  changed_when: false

- name: Resolve active OCPP CSMS release command
  ansible.builtin.command:
    argv:
      - readlink
      - -f
      - "{{ ocpp_csms_release_command }}"
  register: ocpp_csms_release_command_resolved
  changed_when: false

- name: Assert stable OCPP CSMS command target
  ansible.builtin.assert:
    that:
      - ocpp_csms_command_resolved.stdout == ocpp_csms_release_command_resolved.stdout
    fail_msg: >-
      Stable OCPP CSMS command does not resolve to the active current release.
