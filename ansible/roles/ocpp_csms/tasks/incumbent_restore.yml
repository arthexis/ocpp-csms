---
- name: Stop failed replacement before incumbent rollback
  become: true
  ansible.builtin.systemd_service:
    name: "{{ ocpp_csms_service_name }}"
    state: stopped
  failed_when: false
  when: ocpp_csms_incumbent_service | length > 0

- name: Restore incumbent OCPP listener
  become: true
  ansible.builtin.systemd_service:
    name: "{{ ocpp_csms_incumbent_service }}"
    enabled: true
    state: started
  when: ocpp_csms_incumbent_service | length > 0

- name: Verify restored incumbent OCPP listener
  ansible.builtin.wait_for:
    host: "{{ ocpp_csms_verify_host }}"
    port: "{{ ocpp_csms_incumbent_port }}"
    timeout: "{{ ocpp_csms_listener_timeout }}"
    state: started
  when: ocpp_csms_incumbent_service | length > 0
