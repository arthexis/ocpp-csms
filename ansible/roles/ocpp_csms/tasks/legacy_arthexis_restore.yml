---
- name: Stop failed replacement before legacy Arthexis rollback
  become: true
  ansible.builtin.systemd_service:
    name: "{{ ocpp_csms_service_name }}"
    state: stopped
  failed_when: false
  when: ocpp_csms_legacy_arthexis_service | length > 0

- name: Restore legacy Arthexis OCPP listener
  become: true
  ansible.builtin.systemd_service:
    name: "{{ ocpp_csms_legacy_arthexis_service }}"
    enabled: true
    state: started
  when: ocpp_csms_legacy_arthexis_service | length > 0

- name: Verify restored legacy Arthexis listener
  ansible.builtin.wait_for:
    host: "{{ ocpp_csms_verify_host }}"
    port: "{{ ocpp_csms_legacy_arthexis_port }}"
    timeout: "{{ ocpp_csms_listener_timeout }}"
    state: started
  when: ocpp_csms_legacy_arthexis_service | length > 0
