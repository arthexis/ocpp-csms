---
# /etc/ocpp-csms is prepared once alongside persistent TLS configuration.
- name: Create disabled default mail configuration if absent
  become: true
  ansible.builtin.template:
    src: mail.toml.j2
    dest: /etc/ocpp-csms/mail.toml
    owner: "{{ ocpp_csms_service_user }}"
    group: "{{ ocpp_csms_service_group }}"
    mode: "0640"
    force: false

- name: Preserve existing mail configuration with deploy-user ownership
  become: true
  ansible.builtin.file:
    path: /etc/ocpp-csms/mail.toml
    state: file
    owner: "{{ ocpp_csms_service_user }}"
    group: "{{ ocpp_csms_service_group }}"
    mode: "0640"

- name: Validate existing mail configuration as service user
  become: true
  become_user: "{{ ocpp_csms_service_user }}"
  ansible.builtin.command:
    argv:
      - "{{ ocpp_csms_release_venv }}/bin/python"
      - -c
      - >-
        from ocpp_csms.mail import load_mail_config;
        from ocpp_csms.notifications import policy;
        from ocpp_csms.report_schedule import _jobs;
        from pathlib import Path;
        p = Path('/etc/ocpp-csms/mail.toml');
        load_mail_config(p);
        policy(p);
        list(_jobs(p))
  changed_when: false

- name: Install scheduled report service unit
  become: true
  ansible.builtin.template:
    src: ocpp-csms-mail-report.service.j2
    dest: /etc/systemd/system/ocpp-csms-mail-report.service
    mode: "0644"

- name: Install scheduled report timer unit
  become: true
  ansible.builtin.template:
    src: ocpp-csms-mail-report.timer.j2
    dest: /etc/systemd/system/ocpp-csms-mail-report.timer
    mode: "0644"

- name: Configure scheduled report timer enablement
  become: true
  ansible.builtin.systemd_service:
    name: ocpp-csms-mail-report.timer
    enabled: "{{ ocpp_csms_mail_timer_enabled | bool }}"
    state: "{{ 'started' if ocpp_csms_mail_timer_enabled | bool else 'stopped' }}"
    daemon_reload: true
