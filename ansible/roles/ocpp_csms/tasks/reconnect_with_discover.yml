---
# Give a normal reconnect a short chance first. Most deployments do not need
# Discover during release activation, so keep their handoff path unchanged.
- name: Probe charger reconnect before Discover recovery
  ansible.builtin.command:
    argv:
      - "{{ ocpp_csms_release_venv }}/bin/python"
      - -m
      - ocpp_csms.install_cutover
      - wait-reconnect
      - --data-dir
      - "{{ ocpp_csms_data_dir }}"
      - --baseline
      - "{{ ocpp_csms_reconnect_baseline_path }}"
      - --timeout
      - "5"
  register: ocpp_csms_reconnect_probe
  changed_when: false
  failed_when: false

- name: Recover charger reconnect with candidate OCPP Discover
  when: ocpp_csms_reconnect_probe.rc != 0
  block:
    - name: Inspect resident OCPP Discover service before recovery
      become: true
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - --quiet
          - "{{ ocpp_discover_service_name | default('ocpp-discover.service') }}"
      register: ocpp_csms_discover_was_active
      changed_when: false
      failed_when: false

    - name: Stop resident OCPP Discover before candidate recovery
      become: true
      ansible.builtin.command:
        argv:
          - systemctl
          - stop
          - "{{ ocpp_discover_service_name | default('ocpp-discover.service') }}"
      changed_when: true
      failed_when: false

    - name: Clear stale candidate Discover recovery unit
      become: true
      ansible.builtin.command:
        argv:
          - systemctl
          - stop
          - ocpp-discover-handoff.service
      changed_when: false
      failed_when: false

    - name: Start candidate OCPP Discover recovery unit
      become: true
      ansible.builtin.command:
        argv:
          - systemd-run
          - --unit=ocpp-discover-handoff.service
          - --collect
          - --property=Restart=no
          - "{{ ocpp_csms_release_venv }}/bin/python"
          - -m
          - ocpp_discover
          - service
          - --data-dir
          - "{{ ocpp_csms_data_dir }}"
          - --runtime-dir
          - "{{ ocpp_discover_runtime_dir | default('/run/ocpp-discover') }}"
          - --persistent-dir
          - "{{ ocpp_discover_persistent_dir | default('/var/lib/ocpp-discover') }}"
          - --interface
          - "{{ ocpp_discover_interface | default('eth0') }}"
          - --listen-port
          - "{{ ocpp_csms_port | string }}"
      changed_when: true

    - name: Verify charger reconnect after candidate Discover recovery
      ansible.builtin.command:
        argv:
          - "{{ ocpp_csms_release_venv }}/bin/python"
          - -m
          - ocpp_csms.install_cutover
          - wait-reconnect
          - --data-dir
          - "{{ ocpp_csms_data_dir }}"
          - --baseline
          - "{{ ocpp_csms_reconnect_baseline_path }}"
          - --timeout
          - "{{ ocpp_csms_reconnect_timeout }}"
      changed_when: false

    # Reconnect can become visible to the CSMS while Discover is still inside its
    # bounded proof capture. Durable promotion has its own timeout so Ansible does
    # not terminate the transient candidate just as it begins committing state.
    - name: Wait for candidate Discover ownership receipt
      become: true
      ansible.builtin.wait_for:
        path: "{{ ocpp_discover_persistent_dir | default('/var/lib/ocpp-discover') }}/discovered.json"
        state: present
        timeout: "{{ ocpp_csms_discover_promotion_timeout }}"

    - name: Validate candidate Discover persistent state
      become: true
      ansible.builtin.command:
        argv:
          - "{{ ocpp_csms_release_venv }}/bin/python"
          - -m
          - ocpp_discover.lifecycle
          - prepare
          - --persistent-dir
          - "{{ ocpp_discover_persistent_dir | default('/var/lib/ocpp-discover') }}"
          - --json
      register: ocpp_csms_discover_persistent_validation
      changed_when: false

    - name: Require preserved candidate Discover persistent state
      ansible.builtin.assert:
        that:
          - (ocpp_csms_discover_persistent_validation.stdout | from_json).state == 'preserved'
        fail_msg: >-
          Candidate OCPP Discover reconnected the charger but did not complete
          durable ownership promotion before handoff verification ended.

  rescue:
    - name: Stop failed candidate Discover recovery unit
      become: true
      ansible.builtin.command:
        argv:
          - systemctl
          - stop
          - ocpp-discover-handoff.service
      changed_when: false
      failed_when: false

    - name: Restore previous resident OCPP Discover after failed recovery
      become: true
      ansible.builtin.command:
        argv:
          - systemctl
          - start
          - "{{ ocpp_discover_service_name | default('ocpp-discover.service') }}"
      changed_when: true
      failed_when: false
      when: ocpp_csms_discover_was_active.rc | default(1) == 0

    - name: Report candidate Discover reconnect failure
      ansible.builtin.fail:
        msg: >-
          Candidate OCPP Discover could not restore the charger connection:
          {{ ansible_failed_result.msg | default('reconnect verification failure') }}

  always:
    - name: Stop candidate Discover recovery unit after verification
      become: true
      ansible.builtin.command:
        argv:
          - systemctl
          - stop
          - ocpp-discover-handoff.service
      changed_when: false
      failed_when: false
