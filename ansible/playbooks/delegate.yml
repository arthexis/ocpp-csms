---
# CSMS-only delegate endpoint, with a fail-closed security preflight.
- name: Deploy standalone OCPP CSMS delegate endpoint
  hosts: all
  gather_facts: true
  pre_tasks:
    - name: Verify Basic auth is configured before cloud deployment
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - >-
            import json, pathlib, sys;
            p=pathlib.Path('/etc/ocpp-csms/auth.json');
            cfg=json.loads(p.read_text());
            sys.exit(0 if cfg.get('mode') == 'basic' and cfg.get('hash') and cfg.get('salt') else 1)
      changed_when: false
      when: ocpp_csms_expose | default('') | length > 0
  roles:
    - role: ocpp_csms
    - role: ocpp_forwarder
      when:
        - ocpp_forwarder_enabled | default(false) | bool
        - not (ocpp_csms_stage_only | default(false) | bool)
    - role: ocpp_expose
      when:
        - ocpp_csms_expose | default('') | length > 0
        - not (ocpp_csms_stage_only | default(false) | bool)

  post_tasks:
    - name: Ensure excluded Forwarder is disabled
      ansible.builtin.import_tasks: tasks/disable-forwarder.yml
      when:
        - not (ocpp_forwarder_enabled | default(false) | bool)
        - not (ocpp_csms_stage_only | default(false) | bool)
