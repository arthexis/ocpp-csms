---
- name: Deploy OCPP CSMS and Discover when eth0 exists
  hosts: all
  gather_facts: true
  tasks:
    - name: Detect eth0 interface
      ansible.builtin.stat:
        path: /sys/class/net/eth0
      register: ocpp_eth0

    - name: Deploy OCPP CSMS
      ansible.builtin.include_role:
        name: ocpp_csms

    - name: Deploy OCPP Discover when eth0 is available
      ansible.builtin.include_role:
        name: ocpp_discover
      vars:
        ocpp_discover_interface: eth0
      when: ocpp_eth0.stat.exists
