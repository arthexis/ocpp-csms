---
- name: Converge OCPP CSMS satellite
  hosts: all
  gather_facts: true
  roles:
    - role: ocpp_csms
    - role: ocpp_discover
    - role: ocpp_forwarder
      when:
        - ocpp_forwarder_enabled | default(false) | bool
        - not (ocpp_csms_stage_only | default(false) | bool)

  post_tasks:
    - name: Ensure excluded Forwarder is disabled
      ansible.builtin.import_tasks: tasks/disable-forwarder.yml
      when:
        - not (ocpp_forwarder_enabled | default(false) | bool)
        - not (ocpp_csms_stage_only | default(false) | bool)
