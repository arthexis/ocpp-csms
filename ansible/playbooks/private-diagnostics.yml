---
- name: Configure private charger diagnostics receiver
  hosts: localhost
  connection: local
  gather_facts: true
  become: true
  vars:
    diag_operator: "{{ lookup('env', 'USER') }}"
    diag_home: "{{ lookup('env', 'HOME') }}"
    diag_dir: /etc/ocpp-csms/diagnostics-private
    diag_site: /etc/nginx/conf.d/ocpp-csms-private-diagnostics.conf
    diag_cert_path: "{{ diag_dir }}/{{ diag_ip }}.cert.pem"
    diag_key_path: "{{ diag_dir }}/{{ diag_ip }}.key.pem"
  tasks:
    - name: Configure private diagnostics endpoint
      ansible.builtin.import_tasks: ../tasks/private-diagnostics.yml
