---
# Treat missing unit as absent, but never mistake a systemctl error for success.
- name: Inspect excluded Forwarder unit load state
  ansible.builtin.command:
    argv: [systemctl, show, ocpp-forwarder.service, --property=LoadState, --no-pager]
  register: ocpp_forwarder_unit_presence
  changed_when: false
  failed_when: >-
    ocpp_forwarder_unit_presence.rc != 0
    or not (ocpp_forwarder_unit_presence.stdout | trim in
            ['LoadState=loaded', 'LoadState=not-found'])

- name: Disable excluded Forwarder service
  become: true
  ansible.builtin.systemd_service:
    name: ocpp-forwarder.service
    enabled: false
    state: stopped
  when: (ocpp_forwarder_unit_presence.stdout | trim) == 'LoadState=loaded'

- name: Verify excluded Forwarder unit state
  ansible.builtin.command:
    argv: [systemctl, show, ocpp-forwarder.service, "--property=LoadState,ActiveState,UnitFileState", --no-pager]
  register: ocpp_forwarder_active_check
  changed_when: false
  failed_when: >-
    ocpp_forwarder_active_check.rc != 0
    or not ('LoadState=not-found' in ocpp_forwarder_active_check.stdout
            or ('LoadState=loaded' in ocpp_forwarder_active_check.stdout
                and 'ActiveState=inactive' in ocpp_forwarder_active_check.stdout
                and ('UnitFileState=disabled' in ocpp_forwarder_active_check.stdout
                     or 'UnitFileState=masked' in ocpp_forwarder_active_check.stdout)))
