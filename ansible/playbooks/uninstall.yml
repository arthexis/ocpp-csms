---
# Explicit uninstall: remove managed software and exposure, retain user data.
- name: Uninstall managed OCPP CSMS appliance
  hosts: all
  gather_facts: true
  vars:
    ocpp_install_prefix: "{{ ansible_env.HOME }}/.local/share/ocpp-csms"
  tasks:
    - name: Ensure uninstall runs as non-root appliance operator
      ansible.builtin.assert:
        that:
          - ansible_user_id != 'root'
          - ansible_user_uid | int != 0

    - name: Stop and disable OCPP managed services if present
      become: true
      ansible.builtin.command:
        argv: [systemctl, disable, --now, "{{ item }}"]
      loop:
        - ocpp-discover.service
        - ocpp-csms.service
      register: ocpp_uninstall_disable
      changed_when: false
      failed_when: false

    - name: Remove managed systemd unit files
      become: true
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ item }}"
        state: absent
      loop:
        - ocpp-discover.service
        - ocpp-csms.service

    - name: Reload systemd service registrations
      become: true
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Remove managed service command symlinks
      become: true
      ansible.builtin.file:
        path: "/usr/local/bin/{{ item }}"
        state: absent
      loop:
        - ocpp-csms
        - ocpp-discover

    - name: Inspect nginx sites for CSMS-managed exposure
      become: true
      ansible.builtin.find:
        paths: /etc/nginx/sites-available
        file_type: file
        recurse: false
      register: ocpp_uninstall_nginx_candidates
      failed_when: false

    - name: Read nginx site definitions
      become: true
      ansible.builtin.slurp:
        src: "{{ item.path }}"
      loop: "{{ ocpp_uninstall_nginx_candidates.files | default([]) }}"
      register: ocpp_uninstall_nginx_contents
      no_log: true

    - name: Identify CSMS-managed nginx site names
      ansible.builtin.set_fact:
        ocpp_uninstall_nginx_sites: "{{ (ocpp_uninstall_nginx_sites | default([])) + [item.item.path | basename] }}"
      loop: "{{ ocpp_uninstall_nginx_contents.results | default([]) }}"
      when:
        - "'proxy_pass http://127.0.0.1:' in (item.content | b64decode)"
        - "'# Managed by ocpp-csms.' in (item.content | b64decode)"
        - "not (item.item.path | basename).startswith('.')"
      no_log: true

    - name: Remove only identified CSMS nginx sites and snapshots
      become: true
      ansible.builtin.file:
        path: "{{ item.0 }}/{{ item.1 }}"
        state: absent
      loop: "{{ ['/etc/nginx/sites-enabled', '/etc/nginx/sites-available'] | product(ocpp_uninstall_nginx_sites | default([])) | list }}"
      register: ocpp_uninstall_nginx_removed

    - name: Remove CSMS nginx site snapshots
      become: true
      ansible.builtin.file:
        path: "/etc/nginx/sites-available/.{{ item }}.previous"
        state: absent
      loop: "{{ ocpp_uninstall_nginx_sites | default([]) }}"

    - name: Remove CSMS certificate renewal hook
      become: true
      ansible.builtin.file:
        path: /etc/letsencrypt/renewal-hooks/deploy/ocpp-csms-nginx.sh
        state: absent

    - name: Validate nginx after removing CSMS exposure
      become: true
      ansible.builtin.command: nginx -t
      changed_when: false
      when: ocpp_uninstall_nginx_removed.changed | default(false)

    - name: Reload nginx after removing CSMS exposure
      become: true
      ansible.builtin.systemd_service:
        name: nginx
        state: reloaded
      when: ocpp_uninstall_nginx_removed.changed | default(false)

    - name: Check active Discover redirect table
      become: true
      ansible.builtin.command:
        argv: [nft, list, table, ip, ocpp_field_redirect]
      register: ocpp_uninstall_live_redirect
      changed_when: false
      failed_when: false

    - name: Remove active Discover-owned redirect table
      become: true
      ansible.builtin.command:
        argv: [nft, delete, table, ip, ocpp_field_redirect]
      when: ocpp_uninstall_live_redirect.rc == 0
      changed_when: true

    - name: Check Discover persistent integration
      become: true
      ansible.builtin.stat:
        path: /etc/ocpp-discover/nftables.conf
      register: ocpp_uninstall_discover_rules

    - name: Remove Discover-owned persistent nftables integration
      become: true
      ansible.builtin.command:
        argv:
          - "{{ ocpp_install_prefix }}/current/venv/bin/python"
          - -m
          - ocpp_discover.lifecycle
          - remove
      when: ocpp_uninstall_discover_rules.stat.exists
      changed_when: true

    - name: Remove replaceable program releases, not application data
      ansible.builtin.file:
        path: "{{ ocpp_install_prefix }}"
        state: absent

    - name: Report preserved data
      ansible.builtin.debug:
        msg: >-
          CSMS transaction data, authentication credentials and TLS certificate
          archives are retained; managed services and identified nginx exposure removed.
