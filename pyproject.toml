[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ocpp-csms"
version = "0.1.0"
description = "A small Python OCPP CSMS with a companion network discovery service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "ocpp>=0.26,<1",
  "websockets>=12,<14",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<2",
  "pytest-xdist>=3,<4",
]

[project.scripts]
ocpp-csms = "ocpp_csms.cli:main"
ocpp-discover = "ocpp_discover.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ocpp_csms", "src/ocpp_discover"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--durations=10 --durations-min=0.01"
